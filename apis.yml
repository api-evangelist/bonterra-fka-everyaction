aid: bonterra-fka-everyaction

name: Bonterra (fka EveryAction)

description: Bonterra (formerly EveryAction) is a social-good technology company whose EveryAction / NGP VAN platform powers fundraising, advocacy,
  organizing, and supporter engagement for nonprofits, unions, and political campaigns. The EveryAction 8 (EA8) REST API at api.securevan.com/v4
  exposes people matching, contributions and recurring commitments, disbursements, events, survey questions, activist codes, canvass responses,
  bulk import and file-loading jobs, early-vote and voter-registration fields, employers/worksites, scores, printed lists, and MiniVAN exports.
  It uses HTTP Basic authentication with an application name and an API key scoped to a database mode (My Voters or My Campaign), and is documented
  on a ReadMe-hosted developer portal with a reference, recipes, changelog, and an llms.txt.

