- sec0: []
tags:
- name: BallotTypes
paths:
  /ballotTypes:
    get:
      summary: /ballotTypes
      description: Retrieve ballot types available to you
      operationId: ballottypes
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  {\n    \"items\": [\n      {\n        \"ballotTypeId\": 6,\n        \"name\": \"Military\"\n      },\n      {\n        \"ballotTypeId\": 7,\n        \"name\": \"Overseas\"\n      }\n    ],\n    \"nextPageLink\": null,\n    \"count\": 2\n  }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"            \n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - BallotTypes
  /ballotTypes/{ballotTypeId}:
    get:
      summary: /ballotTypes/{ballotTypeId}
      description: Retrieve ballot type if it is available.
      operationId: ballottypes-ballottypeid
      parameters:
      - name: ballotTypeId
        in: path
        description: Unique identifier for a specific Ballot Type
        schema:
          type: integer
          format: int32
          default: 7
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"ballotTypeId\": 7,\n    \"name\": \"Overseas\"\n}"
              schema:
                type: object
                properties:
                  ballotTypeId:
                    type: integer
                    example: 7
                    default: 0
                  name:
                    type: string
                    example: Overseas
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"            \n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    0:{\n      \"code\":\"NOT_FOUND\"\n      \"text\":\"The specified resource cannot be found.\"\n    }\n  ]\n}"
      deprecated: false
      tags:
      - BallotTypes
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
