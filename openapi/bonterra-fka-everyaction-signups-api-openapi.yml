info:
  title: everyaction-8 Signups API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: Signups
paths:
  /signups:
    get:
      summary: /signups
      description: 'Use this endpoint to find all of a Person’s Signups (across all Events) or to find all of the Signups for a specific Event.


        Either the `eventId` parameter, or the `vanId` parameter, *must* be specified.


        If `vanId` is specified but the Person is not accessible, this endpoint will return an error with HTTP Status Code `403 Forbidden`.


        If `vanId` is specified but the Person does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If `eventId` is specified but the Event does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: signups-1
      parameters:
      - name: eventId
        in: query
        description: Unique identifier for an Event. Required if `vanId` is not specified.
        schema:
          type: integer
          format: int32
      - name: vanId
        in: query
        description: Unique identifier for a Person. Required if `eventId` is not specified.
        schema:
          type: string
          default: '100476252'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"eventSignupId\": 2452,\n      \"person\": {\n        \"vanId\": 100476252,\n        \"firstName\": \"James\",\n        \"middleName\": \"Worthington\",\n        \"lastName\": \"Gordon\"\n      },\n      \"event\": {\n        \"eventId\": 1370,\n        \"name\": \"Neighbors Calling Neighbors\",\n        \"shortName\": \"NeighborCall\"\n      },\n      \"shift\": {\n        \"eventShiftId\": 2162,\n        \"name\": null\n      },\n      \"role\": {\n        \"roleId\": 111687,\n        \"name\": \"Host\"\n      },\n      \"status\": {\n        \"statusId\": 4,\n        \"name\": \"Invited\"\n      },\n      \"location\": {\n        \"locationId\": 272,\n        \"name\": \"Campaign HQ\",\n        \"displayName\": \"Campaign HQ, 48 Grove St Somerville, MA 02144-2500 \"\n      },\n      \"startTimeOverride\": \"2015-06-01T15:00:00-04:00\",\n      \"endTimeOverride\": \"2015-06-01T16:00:00-04:00\",\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 1\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n      \"code\":\"FORBIDDEN\"\n      \"text\":\"Access to this action is restricted\"\n    }\n  ]\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Signups
    post:
      summary: /signups
      description: 'Use this endpoint to record a Person’s participation at an Event. Because it’s not easy to know whether a Person is already signed up for an Event, this endpoint will create a new Signup only if a Signup with the same Person, Event, Role, and Shift does not already exist. If a Signup does exist, it will override the existing Signup’s Status, Start Time, End Time, and (if specified) Location. A record of this change is displayed in the VAN UI.


        When a Signup is created or updated, a canvass response is generated to represent the signup interaction. The *Input Type* is *API*, the *Date Canvassed* is the current date, the *Canvasser* is the API user associated with the current context, and the *Result Code* corresponds to a result most appropriate for the given Status (e.g., *Scheduled* → *Canvassed*). Consult the VAN UI for a detailed mapping.


        This endpoint accepts a standard Signup object with simple types and no read-only values specified.


        If successful, the endpoint responds with HTTP Status Code `201 Created` (even if it matched and updated an existing Signup) and the integer ID of the created Signup in the response body. It also sets the **Location** header to the location of the newly created Signup.'
      operationId: signups-2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                person:
                  type: object
                  properties:
                    vanId:
                      type: string
                      default: '100476252'
                event:
                  type: object
                  properties:
                    eventId:
                      type: integer
                      default: 1370
                      format: int32
                shift:
                  type: object
                  properties:
                    eventShiftId:
                      type: integer
                      default: 2162
                      format: int32
                role:
                  type: object
                  properties:
                    roleId:
                      type: integer
                      default: 111687
                      format: int32
                status:
                  type: object
                  properties:
                    statusId:
                      type: integer
                      default: 4
                      format: int32
                location:
                  type: object
                  properties:
                    locationId:
                      type: integer
                      default: 272
                      format: int32
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"eventSignupId\": 2452,\n  \"person\": {\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"middleName\": \"Worthington\",\n    \"lastName\": \"Gordon\"\n  },\n  \"event\": {\n    \"eventId\": 1370,\n    \"name\": \"Neighbors Calling Neighbors\",\n    \"shortName\": \"NeighborCall\"\n  },\n  \"shift\": {\n    \"eventShiftId\": 2162,\n    \"name\": null\n  },\n  \"role\": {\n    \"roleId\": 111687,\n    \"name\": \"Host\"\n  },\n  \"status\": {\n    \"statusId\": 4,\n    \"name\": \"Invited\"\n  },\n  \"location\": {\n    \"locationId\": 272,\n    \"name\": \"Campaign HQ\",\n    \"displayName\": \"Campaign HQ, 48 Grove St Somerville, MA 02144-2500\"\n  },\n  \"startTimeOverride\": \"2015-06-01T15:00:00-04:00\",\n  \"endTimeOverride\": \"2015-06-01T16:00:00-04:00\"\n}"
              schema:
                type: object
                properties:
                  eventSignupId:
                    type: integer
                    example: 2452
                    default: 0
                  person:
                    type: object
                    properties:
                      vanId:
                        type: integer
                        example: 100476252
                        default: 0
                      firstName:
                        type: string
                        example: James
                      middleName:
                        type: string
                        example: Worthington
                      lastName:
                        type: string
                        example: Gordon
                  event:
                    type: object
                    properties:
                      eventId:
                        type: integer
                        example: 1370
                        default: 0
                      name:
                        type: string
                        example: Neighbors Calling Neighbors
                      shortName:
                        type: string
                        example: NeighborCall
                  shift:
                    type: object
                    properties:
                      eventShiftId:
                        type: integer
                        example: 2162
                        default: 0
                      name: {}
                  role:
                    type: object
                    properties:
                      roleId:
                        type: integer
                        example: 111687
                        default: 0
                      name:
                        type: string
                        example: Host
                  status:
                    type: object
                    properties:
                      statusId:
                        type: integer
                        example: 4
                        default: 0
                      name:
                        type: string
                        example: Invited
                  location:
                    type: object
                    properties:
                      locationId:
                        type: integer
                        example: 272
                        default: 0
                      name:
                        type: string
                        example: Campaign HQ
                      displayName:
                        type: string
                        example: Campaign HQ, 48 Grove St Somerville, MA 02144-2500
                  startTimeOverride:
                    type: string
                    example: '2015-06-01T15:00:00-04:00'
                  endTimeOverride:
                    type: string
                    example: '2015-06-01T16:00:00-04:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Signups
  /signups/statuses:
    get:
      summary: /signups/statuses
      description: 'Use this endpoint to retrieve all valid Signup Statuses for a given Event or for any Event of a given Event Type.


        The information returned by this endpoint changes only as frequently as an Event Type changes (which is typically not very often in production). Consider caching the results of this endpoint.'
      operationId: signupsstatuses
      parameters:
      - name: eventId
        in: query
        description: Filters Statuses to just those available to this Event (based on its Event Type). Required if `eventTypeId` is not specified.
        schema:
          type: integer
          format: int32
      - name: eventTypeId
        in: query
        description: Optional; Filters Statuses to just those available to this Event Type. Required if `eventId` is not specified.
        schema:
          type: integer
          format: int32
          default: 143856
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"statusId\": 2,\n    \"name\": \"Completed\"\n  },\n  {\n    \"statusId\": 11,\n    \"name\": \"Confirmed\"\n  },\n  {\n    \"statusId\": 3,\n    \"name\": \"Declined\"\n  },\n  {\n    \"statusId\": 4,\n    \"name\": \"Invited\"\n  },\n  {\n    \"statusId\": 1,\n    \"name\": \"Scheduled\"\n  },\n  {\n    \"statusId\": 15,\n    \"name\": \"Walk In\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    statusId:
                      type: integer
                      example: 2
                      default: 0
                    name:
                      type: string
                      example: Completed
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Signups
  /signups/{eventSignupId}:
    get:
      summary: /signups/{eventSignupId}
      description: 'Use this endpoint to retrieve a specific Event Signup.


        This endpoint returns a standard Signup object, if found.


        If the specified Signup does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: signupseventsignupid-1
      parameters:
      - name: eventSignupId
        in: path
        description: Required; Unique identifier of an existing event shift
        schema:
          type: integer
          format: int32
          default: 2452
        required: true
      - name: IncludePhoneAndEmail
        in: query
        description: True / False; By default, phone and email data is not returned.
        schema:
          type: string
          default: 'true'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"eventSignupId\": 2452,\n  \"person\": {\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"middleName\": \"Worthington\",\n    \"lastName\": \"Gordon\"\n  },\n  \"event\": {\n    \"eventId\": 1370,\n    \"name\": \"Neighbors Calling Neighbors\",\n    \"shortName\": \"NeighborCall\"\n  },\n  \"shift\": {\n    \"eventShiftId\": 2162,\n    \"name\": null\n  },\n  \"role\": {\n    \"roleId\": 111687,\n    \"name\": \"Host\"\n  },\n  \"status\": {\n    \"statusId\": 4,\n    \"name\": \"Invited\"\n  },\n  \"location\": {\n    \"locationId\": 272,\n    \"name\": \"Campaign HQ\",\n    \"displayName\": \"Campaign HQ, 48 Grove St Somerville, MA 02144-2500\"\n  },\n  \"startTimeOverride\": \"2015-06-01T15:00:00-04:00\",\n  \"endTimeOverride\": \"2015-06-01T16:00:00-04:00\"\n}"
              schema:
                type: object
