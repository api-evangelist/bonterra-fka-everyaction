                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Signups
    delete:
      summary: /signups/{eventSignupId}
      description: 'This endpoint deletes an existing Signup. Use with caution as this this action is irreversible and a record of this change is not display in the VAN UI.


        Typically it’s more appropriate to update an existing Signup with a Status of Declined or No Show rather than to delete the record entirely.


        Deleting a Signup does not delete any canvass responses associated with actions taken on the Signup.


        If the specified Signup does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` and an empty response body.'
      operationId: signupseventsignupid-2
      parameters:
      - name: eventSignupId
        in: path
        description: Required; Unique identifier of an existing Signup
        schema:
          type: integer
          format: int32
          default: 2423
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
