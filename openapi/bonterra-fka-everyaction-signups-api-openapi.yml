    put:
      summary: /signups/{eventSignupId}
      description: 'Use this endpoint to update a specific existing Signup. A record of this change is displayed in the VAN UI.


        A Signup’s Event and Person properties are immutable after creation. If you want to sign up a Person for a different Event, first delete the existing Signup and create a new one.


        If you do not know the `eventSignupId`, consider using the create or modify endpoint.


        When a Signup is updated, a canvass response is generated to represent the signup interaction. The *Input Type* is API, the *Date Canvassed* is the current date, the *Canvasser* is the API user associated with the current context, and the *Result Code* corresponds to a result most appropriate for the given Status (e.g., *Scheduled* → *Canvassed*). Consult the VAN UI for a detailed mapping.'
      operationId: signupseventsignupid
      parameters:
      - name: eventSignupId
        in: path
        description: Required; Unique identifier of an existing Signup
        schema:
          type: integer
          format: int32
          default: 2452
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventSignupId:
                  type: integer
                  default: 2452
                  format: int32
                person:
                  type: object
                  properties:
                    vanId:
                      type: string
                      default: '100476252'
                event:
                  type: object
                  properties:
                    eventId:
                      type: integer
                      default: 1370
                      format: int32
                shift:
                  type: object
                  properties:
                    eventShiftId:
                      type: integer
                      default: 2162
                      format: int32
                role:
                  type: object
                  properties:
                    roleId:
                      type: integer
                      default: 111687
                      format: int32
                status:
                  type: object
                  properties:
                    statusId:
                      type: integer
                      default: 4
                      format: int32
                location:
                  type: object
                  properties:
                    locationId:
                      type: integer
                      default: 272
                      format: int32
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
