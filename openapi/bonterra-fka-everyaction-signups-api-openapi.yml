                      shortName:
                        type: string
                        example: NeighborCall
                  shift:
                    type: object
                    properties:
                      eventShiftId:
                        type: integer
                        example: 2162
                        default: 0
                      name: {}
                  role:
                    type: object
                    properties:
                      roleId:
                        type: integer
                        example: 111687
                        default: 0
                      name:
                        type: string
                        example: Host
                  status:
                    type: object
                    properties:
                      statusId:
                        type: integer
                        example: 4
