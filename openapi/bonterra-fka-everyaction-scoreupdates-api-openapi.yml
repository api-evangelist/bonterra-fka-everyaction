info:
  title: everyaction-8 Score Updates API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: ScoreUpdates
paths:
  /scoreUpdates:
    get:
      summary: /scoreUpdates
      description: Get all available Score Updates, optionally filtered by search parameters.
      operationId: scoreupdates
      parameters:
      - name: createdBefore
        in: query
        description: Optional; Filters Score Updates to those created before (and not including) a given date (in the format yyyy-mm-dd)
        schema:
          type: string
          format: date
          default: '2021-12-31'
      - name: createdAfter
        in: query
        description: Optional; Filters Score Updates to those created after (and not including) a given date (in the format yyyy-mm-dd)
        schema:
          type: string
          format: date
          default: '2021-01-01'
      - name: scoreId
        in: query
        description: Optional; Filters Score Updates to those of the given score
        schema:
          type: integer
          format: int32
          default: 999
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"scoreUpdateId\": 1888,\n      \"score\": {\n        \"scoreId\": 888,\n        \"name\": \"Baseball cap wearer\",\n        \"shortName\": \"Likelihood of wearing a baseball cap\",\n        \"description\": \"Indicates our best guess as to whether this voter wears a baseball cap\",\n        \"minValue\": 1.00,\n        \"maxValue\": 100.00,\n      },\n      \"updateStatistics\": {\n        \"totalRows\": 100,\n        \"duplicateRows\": 3,\n        \"matchedRows\": 100,\n        \"matchPercent\": 100.0,\n        \"increasedBy\": 100,\n        \"decreasedBy\": 0,\n        \"nulledOut\": 0,\n        \"added\": 0,\n        \"outOfRange\": 0,\n        \"badValues\": 1,\n        \"maxValue\": 10.0,\n        \"minValue\": 90.00,\n        \"averageValue\": 50.0,\n        \"medianValue\": 47.0\n      },\n      \"loadStatus\": \"Completed\",\n      \"dateProcessed\": \"2015-08-23T02:00:00Z\"\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 1\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - ScoreUpdates
  /scoreUpdates/{scoreUpdateId}:
    get:
      summary: /scoreUpdates/{scoreUpdateId}
      description: Retrieve a single score update
      operationId: scoreupdatesscoreupdateid
      parameters:
      - name: scoreUpdateId
        in: path
        description: Required; Unique identifier of the score update to be retrieved
        schema:
          type: integer
          format: int32
          default: 1888
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"scoreUpdateId\": 1888,\n  \"score\": {\n    \"scoreId\": 888,\n    \"name\": \"Baseball cap wearer\",\n    \"shortName\": \"Likelihood of wearing a baseball cap\",\n    \"description\": \"Indicates our best guess as to whether this voter wears a baseball cap\",\n    \"minValue\": 1.00,\n    \"maxValue\": 100.00,\n  },\n  \"updateStatistics\": {\n    \"totalRows\": 100,\n    \"duplicateRows\": 3,\n    \"matchedRows\": 100,\n    \"matchPercent\": 100.0,\n    \"increasedBy\": 100,\n    \"decreasedBy\": 0,\n    \"nulledOut\": 0,\n    \"added\": 0,\n    \"outOfRange\": 0,\n    \"badValues\": 1,\n    \"maxValue\": 10.0,\n    \"minValue\": 90.00,\n    \"averageValue\": 50.0,\n    \"medianValue\": 47.0\n  },\n  \"loadStatus\": \"Completed\",\n  \"dateProcessed\": \"2015-08-23T02:00:00Z\"\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - ScoreUpdates
    patch:
      summary: /scoreUpdates/{scoreUpdateId}
      description: Changes the status of a score (e.g., from `PendingApproval` to `Approved`). Score updates that are approved, are applied at off-peak hours.
      operationId: scoreupdatesscoreupdateid-1
      parameters:
      - name: scoreUpdateId
        in: path
        description: Required; Unique identifier of the score update to be changed
        schema:
          type: integer
          format: int32
          default: 1888
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loadStatus:
                  type: string
                  description: 'Required; The new status for a score update; one of: `PendingApproval` → Score updates in the pending state will not be applied, `Approved` → Approves the score update for application during off-peak hours, `Disapproved` → Explicitly indicates the score update should not be applied (e.g., because the load statistics indicate an issue with a source file), `Canceled` → Cancel the score update process (does not stop anything that is currently in process, behaves the same as Disapproved'
                  default: Approved
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - ScoreUpdates
