info:
  title: everyaction-8 File Loading Jobs API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: FileLoadingJobs
paths:
  /fileLoadingJobs:
    post:
      summary: /fileLoadingJobs
      description: Initiates a File-Loading Job by specifying the URL for a zipped CSV file, containing data to be loaded, and the action(s) to be taken on it.
      operationId: fileloadingjobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 'Required; A description of the job, to be included in notifications (whether via email or webhook). Maximum length is 255 characters. No HTML or HTML special character syntax. More precisely, input must not match this regex: `[\<>]+|&#`'
                  default: Load habberdasher score
                file:
                  type: object
                  description: Required; A `file` object which describes the source file and columns to be acted on.
                  properties:
                    fileName:
                      type: string
                      description: '**Required**; Name of the delimited file within the zip file accessible by `sourceUrl`.'
                      default: MyScoreResults.csv
                    hasHeader:
                      type: boolean
                      description: Optional; Indicates that the first line of the file should be skipped. A header row in the file will be not be used; column names are determined by the required `columns` array and the order the columns appear in the file. Defaults to `false`.
                      default: false
                    sourceUrl:
                      type: string
                      description: '**Required**; URL at which a zip file containing `fileName` can be accessed. The following URL schemes (“protocols”) are supported: SFTP, FTPS, HTTPS. If authentication is required, the username and password should be included in the URL.'
                      default: sftp://user:password@foo.bar.us/my_camp_score.zip
                    columnDelimiter:
                      type: string
                      description: 'Optional; Character that separates each each column; one of: `CSV` → comma (,) separated values, `Tab` → Tab separated values, `Pipe` → pipe (|) separated values. Defaults to `CSV`.'
                      default: CSV
                    columns:
                      type: array
                      description: '**Required**; An ordered array of `column` objects, describing each column of the source file (from left to right). At least one column is required.'
                      items:
                        properties:
                          name:
                            type: string
                            description: '**Required**; A column’s unique name that can be referenced in actions (e.g., `VanID`). The name can consist of alphanumeric characters only; no spaces or punctuation are permitted. A column `name` must be present for every column in the uploaded file, listed in the order in which they appear in the file from left to right.'
                            default: VanID
                        type: object
                actions:
                  type: array
                  description: Required; An array of `action` objects, each defining an action to be taken. Each Job Action Type has different supported and required for the Action property. See the individual Action Type docs below for more info.
                listeners:
                  type: array
                  description: Optional; An optional array of one or two `listener` objects indicating means of notification, email or webhook. Only one of each type can be specified.
                  items:
                    properties:
                      type:
                        type: string
                        description: '**Required**; A method of notification: `EMAIL` or `URL`; one of: `EMAIL` → Indicates that ‘value’ is an email address to which the details of a job’s success or failure should be sent., `URL` → Indicates that ‘value’ is a URL to which the details of a job’s success or failure will be posted. The results will be a JSON object sent via POST and will be formatted like a [notification](https://everyaction.readme.io/reference#notification) object.'
                        default: EMAIL
                      value:
                        type: string
                        description: '**Required**; A valid email address or URL (e.g., `datateam@mydomain.com`, `https://mydomain.com/vanjobs/notify/myInternalJobId`)'
                        default: datateam@mydomain.com
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"jobId\": 998877\n}"
              schema:
                type: object
                properties:
                  jobId:
                    type: integer
                    example: 998877
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - FileLoadingJobs
  /fileLoadingJobs/{jobId}:
    get:
      summary: /fileLoadingJobs/{jobId}
      description: This endpoint returns status and metadata about an existing File-Loading Job, which is specified by the unique identifier `jobId`. The `jobId` is provided as the response to a `POST` request to create a File Loading Job.
      operationId: fileloadingjobsjobid
      parameters:
      - name: jobId
        in: path
        description: Unique identifier for the File-Loading Job
        schema:
          type: integer
          format: int32
          default: 998877
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"jobId\": 998877,\n    \"actions\": [\n      {\n        \"actionType\": \"score\",\n        \"personIdColumn\": \"hatWearerId\",\n        \"personIdType\": \"VANID\",\n        \"scoreColumn\": \"hatWearingScore\",\n        \"scoreId\": 112233\n      },\n      {\n        \"actionType\": \"score\",\n        \"personIdColumn\": \"hatWearerId\",\n        \"personIdType\": \"VANID\",\n        \"scoreColumn\": \"needsAnotherHatScore\",\n        \"scoreId\": 112234,\n        \"approvalCriteria\": {\n        \"average\": 75.2,\n        \"tolerance\": 1.3\n      }\n    ],\n    \"description\": \"Load habberdasher score\",\n    \"file\": {\n      \"columnDelimiter\": \"Csv\",\n      \"columns\": [\n        {\"name\": \"hatWearerId\"},\n        {\"name\": \"hatWearingScore\"},\n        {\"name\": \"needsAnotherHatScore\"}\n      ],\n      \"fileName\": \"haberdashery.csv\",\n      \"hasHeader\": true,\n      \"sourceUrl\": \"sftp://keep:yourHatOn@ftp.headpieces.example.org/haberdasher.csv.zip\"\n    },\n    \"listeners\": null,\n    \"interventionCallbackUrl\": null,\n    \"invalidRowsFileUrl\": null\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - FileLoadingJobs
  /fileLoadingJobs/{jobId}/stats:
    get:
      summary: /fileLoadingJobs/{jobId}/stats
      description: This endpoint returns status and metadata information about an existing Phone Loading job specified by the unique identifier `jobId`. Note that this endpoint is only valid for the `PhonesFile` action type.
      operationId: fileloadingjobsjobidstats
      parameters:
      - name: jobId
        in: path
        description: Unique identifier for the File-Loading Job
        schema:
          type: integer
          format: int32
          default: 123
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"items\": [\n        {\n            \"countBadRows\": 0,\n            \"percentMatched\": 100,\n            \"countPhonesAdded\": 1,\n            \"actionType\": \"PhonesFile\",\n            \"countTotalRows\": 1,\n            \"countMatchedRows\": 1\n        }\n    ],\n    \"nextPageLink\": null,\n    \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        countBadRows:
                          type: integer
                          example: 0
                          default: 0
                        percentMatched:
                          type: integer
                          example: 100
                          default: 0
                        countPhonesAdded:
                          type: integer
                          example: 1
                          default: 0
                        actionType:
                          type: string
                          example: PhonesFile
                        countTotalRows:
                          type: integer
                          example: 1
                          default: 0
                        countMatchedRows:
                          type: integer
                          example: 1
                          default: 0
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"            \n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"NOT_FOUND\",\n            \"text\": \"The specified resource cannot be found.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - FileLoadingJobs
