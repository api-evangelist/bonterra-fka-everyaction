info:
  title: everyaction-8 Canvass Responses API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: CanvassResponses
paths:
  /canvassResponses/contactTypes:
    get:
      summary: /canvassResponses/contactTypes
      description: Contact Types are different ways a canvass response was collected. For example, responses collected while walking around your neighborhood would have a Contact Type of *Walk*. While most Contact Types are common across VAN instances, some instances may have custom Contact Types. Use this endpoint to retrieve all available Contact Types. Additionally, Contact Types can be assigned to specific Input Types. For example, a Contact Type of *Walk* wouldn’t make sense for an Input Type of *Virtual Phone Bank*. To return Input Type appropriate Contact Types, use the `inputTypeId` parameter.
      operationId: canvassresponses-contacttypes
      parameters:
      - name: inputTypeId
        in: path
        description: Filter Contact Types to those available to the given Input Type
        schema:
          type: integer
          format: int32
          default: 11
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"contactTypeId\": 1,\n    \"name\": \"Phone\"\n  },\n  {\n    \"contactTypeId\": 2,\n    \"name\": \"Walk\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    contactTypeId:
                      type: integer
                      example: 1
                      default: 0
                    name:
                      type: string
                      example: Phone
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - CanvassResponses
  /canvassResponses/inputTypes:
    get:
      summary: /canvassResponses/inputTypes
      description: Input Types are different ways canvass responses are entered into VAN. For example, responses entered via Bulk Upload will use the Input Type of *Bulk*. By default, responses entered via the API will use an Input Type of *API*. While most Input Types are common across VAN instances, some instances may have custom Input Types. Use this endpoint to retrieve all available Input Types.
      operationId: canvassresponses-inputtypes
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"inputTypeId\": 11,\n    \"name\": \"API\"\n  },\n  {\n    \"inputTypeId\": 4,\n    \"name\": \"Bulk\"\n  },\n  {\n    \"inputTypeId\": 2,\n    \"name\": \"Manual\"\n  },\n  {\n    \"inputTypeId\": 14,\n    \"name\": \"Mobile\"\n  },\n  {\n    \"inputTypeId\": 10,\n    \"name\": \"VPB\"\n  },\n  {\n    \"inputTypeId\": 23,\n    \"name\": \"Website\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    inputTypeId:
                      type: integer
                      example: 11
                      default: 0
                    name:
                      type: string
                      example: API
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - CanvassResponses
  /canvassResponses/resultCodes:
    get:
      summary: /canvassResponses/resultCodes
      description: 'Result Codes, or contact dispositions, are the result of a contact attempt. For example, *Not Home*, *Wrong Number*, *Moved*, etc. A successful contact interaction yields a Result Code called *Canvassed* which is automatically applied when canvass responses are submitted (e.g., when a Survey Response is recorded).


        Unsuccessful contact attempts are what Result Codes are all about. This endpoint returns a list of those response codes available in the current context. Similar to Contact Types, Result Codes’ availability can vary by Input Type and/or Contact Type. For example, *Wrong Number* only makes sense in the context of a *Call* Contact Type. *Moved* only makes sense in the context of a *Walk* Contact Type.'
      operationId: canvassresponses-resultcodes
      parameters:
      - name: inputTypeId
        in: query
        description: Optional; filter Result Codes to those available to the given Input Type
        schema:
          type: integer
          format: int32
          default: 11
      - name: contactTypeId
        in: query
        description: Optional; filter Result Codes to those available to the given Contact Type
        schema:
          type: integer
          format: int32
          default: 82
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"resultCodeId\": 18,\n    \"name\": \"Busy\",\n    \"mediumName\": \"Busy\",\n    \"shortName\": \"BZ\"\n  },\n  {\n    \"resultCodeId\": 25,\n    \"name\": \"Disconnected\",\n    \"mediumName\": \"Disc\",\n    \"shortName\": \"WX\"\n  },\n  {\n    \"resultCodeId\": 19,\n    \"name\": \"Left Message\",\n    \"mediumName\": \"LM\",\n    \"shortName\": \"LM\"\n  },\n  {\n    \"resultCodeId\": 20,\n    \"name\": \"Wrong Number\",\n    \"mediumName\": \"Wr#\",\n    \"shortName\": \"WN\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    resultCodeId:
                      type: integer
                      example: 18
                      default: 0
                    name:
                      type: string
                      example: Busy
                    mediumName:
                      type: string
                      example: Busy
                    shortName:
                      type: string
                      example: BZ
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - CanvassResponses
