tags:
- name: Scores
paths:
  /scores:
    get:
      summary: /scores
      description: Get all available range scores
      operationId: scores-1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"scoreId\": 123,\n      \"name\": \"Haberdashery score\",\n      \"shortName\": \"HATS\",\n      \"description\": \"Estimation of how many hats an individual owns\",\n      \"scoreType\": \"Range\",\n      \"minValue\": 1.00,\n      \"maxValue\": 10.00\n    },\n    {\n      \"scoreId\": 555,\n      \"name\": \"Hat disposition\",\n      \"shortName\": \"HATD\",\n      \"description\": \"Likelihood of wanting more hats\",\n      \"scoreType\": \"Range\",\n      \"minValue\": 1.00,\n      \"maxValue\": 100.00\n    },\n    {\n      \"scoreId\": 782,\n      \"name\": \"Estimated Hat Enthusiasm\",\n      \"shortName\": \"ENTH\",\n      \"description\": \"Estimated enthusiasm level\",\n      \"scoreType\": \"Value\",\n      \"values\": [\n        {\n          \"scoreValueId\": 12,\n          \"name\": \"Low\",\n          \"shortName\": \"low\",\n          \"sortOrder\": 1\n        },\n        {\n          \"scoreValueId\": 13,\n          \"name\": \"Medium\",\n          \"shortName\": \"med\",\n          \"sortOrder\": 2\n        },\n        {\n          \"scoreValueId\": 14,\n          \"name\": \"High\",\n          \"shortName\": \"high\",\n          \"sortOrder\": 3\n        }\n      ]\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 3\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        scoreId:
                          type: integer
                          example: 123
                          default: 0
                        name:
                          type: string
                          example: Haberdashery score
                        shortName:
                          type: string
                          example: HATS
                        description:
                          type: string
                          example: Estimation of how many hats an individual owns
                        scoreType:
                          type: string
                          example: Range
                        minValue:
                          type: integer
                          example: 1
                          default: 0
                        maxValue:
                          type: integer
                          example: 10
                          default: 0
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 3
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Scores
  /scores/{scoreId}:
    get:
      summary: /scores/{scoreId}
      description: Retrieve a single range score
      operationId: scoresscoreid
      parameters:
      - name: scoreId
        in: path
        description: Required; Unique identifier of the score to be retrieved
        schema:
          type: integer
          format: int32
          default: 123
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK - Range Score:
                  value: "{\n  \"scoreId\": 123,\n  \"name\": \"Haberdashery score\",\n  \"shortName\": \"HATS\",\n  \"description\": \"Estimation of how many hats an individual owns\",\n  \"scoreType\": \"Range\",\n  \"minValue\": 1.00,\n  \"maxValue\": 10.00\n}"
                OK - Value Score:
                  value: "{\n  \"scoreId\": 782,\n  \"name\": \"Estimated Hat Enthusiasm\",\n  \"shortName\": \"ENTH\",\n  \"description\": \"Estimated enthusiasm level\",\n  \"scoreType\": \"Value\",\n  \"values\": [\n    {\n      \"scoreValueId\": 12,\n      \"name\": \"Low\",\n      \"shortName\": \"low\",\n      \"sortOrder\": 1\n    },\n    {\n      \"scoreValueId\": 13,\n      \"name\": \"Medium\",\n      \"shortName\": \"med\",\n      \"sortOrder\": 2\n    },\n    {\n      \"scoreValueId\": 14,\n      \"name\": \"High\",\n      \"shortName\": \"high\",\n      \"sortOrder\": 3\n    }\n  ]\n}"
              schema:
                oneOf:
                - title: OK - Range Score
                  type: object
                  properties:
                    scoreId:
                      type: integer
                      example: 123
                      default: 0
                    name:
                      type: string
                      example: Haberdashery score
                    shortName:
                      type: string
                      example: HATS
                    description:
                      type: string
                      example: Estimation of how many hats an individual owns
                    scoreType:
                      type: string
                      example: Range
                    minValue:
                      type: integer
                      example: 1
                      default: 0
                    maxValue:
                      type: integer
                      example: 10
                      default: 0
                - title: OK - Value Score
                  type: object
                  properties:
                    scoreId:
                      type: integer
                      example: 782
                      default: 0
                    name:
                      type: string
                      example: Estimated Hat Enthusiasm
                    shortName:
                      type: string
                      example: ENTH
                    description:
                      type: string
                      example: Estimated enthusiasm level
                    scoreType:
                      type: string
                      example: Value
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          scoreValueId:
                            type: integer
                            example: 12
                            default: 0
                          name:
                            type: string
                            example: Low
                          shortName:
                            type: string
                            example: low
                          sortOrder:
                            type: integer
                            example: 1
                            default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Scores
  /scores/{scoreId}/committeeAccess:
    get:
      summary: /scores/{scoreId}/committeeAccess
      description: Use this endpoint to retrieve the committee access details of a specific Score.
      operationId: scoresscoreidcommitteeaccess
      parameters:
      - name: scoreId
        in: path
        description: Required; Unique identifier of an existing Score
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"scoreId\": 12345,\n\t\"scoreName\": \"Digital Turnout Score\",\n\t\"ownerCommittee\": {\n\t\t\"name\": \"People for Good\",\n\t\t\"id\": 123\n\t},\n\t\"committeesWithAccess\": [\n\t\t{\n\t\t\t\"name\": \"More People for Good\",\n\t\t\t\"id\": 456\n\t\t}\n\t]\n}"
              schema:
                type: object
                properties:
                  scoreId:
                    type: integer
                    example: 12345
                    default: 0
                  scoreName:
                    type: string
                    example: Digital Turnout Score
                  ownerCommittee:
                    type: object
                    properties:
                      name:
                        type: string
                        example: People for Good
                      id:
                        type: integer
                        example: 123
                        default: 0
                  committeesWithAccess:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: More People for Good
                        id:
                          type: integer
                          example: 456
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Scores
