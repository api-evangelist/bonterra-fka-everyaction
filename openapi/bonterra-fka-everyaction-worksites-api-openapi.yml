paths:
  /worksites:
    get:
      summary: /worksites
      description: Use this endpoint to retrieve all Worksites that are available in the current context.
      operationId: worksites-1
      parameters:
      - name: employerId
        in: query
        description: Optional; filters results by the Employer with the specified ID
        schema:
          type: integer
          format: int32
          default: 99
      - name: isMyOrganization
        in: query
        description: Optional; filters results by whether the Employer associated with the Worksite is designated `isMyOrganization`
        schema:
          type: boolean
          default: false
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of expansion properties: `workAreas`'
        schema:
          type: string
          default: workAreas
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
          default: 40
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"worksiteId\": 124,\n      \"name\": \"Forestdale School\",\n      \"isPreferred\": true,\n      \"address\": {\n        \"addressLine1\": \"74 Sylvan St\",\n        \"unitNo\": null,\n        \"city\": \"Malden\",\n        \"stateOrProvince\": \"MA\",\n        \"zipOrPostalCode\": \"02148\"\n      },\n      \"employer\": {\n        \"employerId\": 99,\n        \"name\": \"Malden Public Schools\"\n      },\n      \"workAreas\": null\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        worksiteId:
                          type: integer
                          example: 124
                          default: 0
                        name:
                          type: string
                          example: Forestdale School
                        isPreferred:
                          type: boolean
                          example: true
                          default: true
                        address:
                          type: object
                          properties:
                            addressLine1:
                              type: string
                              example: 74 Sylvan St
                            unitNo: {}
                            city:
                              type: string
                              example: Malden
                            stateOrProvince:
                              type: string
                              example: MA
                            zipOrPostalCode:
                              type: string
                              example: 02148
                        employer:
                          type: object
                          properties:
                            employerId:
                              type: integer
                              example: 99
                              default: 0
                            name:
                              type: string
                              example: Malden Public Schools
                        workAreas: {}
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Worksites
