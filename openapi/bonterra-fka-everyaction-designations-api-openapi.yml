- name: Designations
paths:
  /designations:
    get:
      summary: /designations
      description: 'Gets a list of designations


        *Description*


        Use this endpoint to get designation IDs and names'
      operationId: get-designations
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"items\" : [\n        {\n          \"designationId\": 123456789,\n          \"name\": \"Jane for Congress Committee\"\n        },\n        {\n          \"designationId\": 123456790,\n          \"name\": \"Jane Smith Progressive Leadership PAC\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        designationId:
                          type: integer
                          example: 123456789
                          default: 0
                        name:
                          type: string
                          example: Jane for Congress Committee
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"            \n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Designations
  /designations/{designationId}:
    get:
      summary: /designations/{designationId}
      description: Get the details of a Designation.
      operationId: designations-designationid
      parameters:
      - name: $expand
        in: query
        description: Valid `$expand` sections are `disclosureFields`, `attributionTypes`, `paymentTypes` and `bankAccounts`
        schema:
          type: string
      - name: designationId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
                Result 1:
                  summary: Result 1
                  value:
                    designationId: 9999
                    name: An Example Designation
                    officialName: Example Designation
                    paymentTypes:
