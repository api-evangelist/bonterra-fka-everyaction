        in: path
        description: Required; unique identifier for the Employer
        schema:
          type: integer
          format: int32
          default: 671
        required: true
      - name: bargainingUnitId
        in: path
        description: Required; unique identifier for the master [Bargaining Unit](https://docs.everyaction.com/reference/bargaining-units)
        schema:
          type: integer
