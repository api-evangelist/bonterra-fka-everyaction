              schema:
                type: object
                properties:
                  employerBargainingUnitJobClassId:
                    type: integer
                    example: 1056
                    default: 0
                  employerBargainingUnitId:
                    type: integer
                    example: 98
                    default: 0
                  bargainingUnit:
                    type: object
                    properties:
                      bargainingUnitId:
                        type: integer
                        example: 35
                        default: 0
                      name:
                        type: string
                        example: Maintenance
                  jobClass:
                    type: object
                    properties:
                      jobClassId:
                        type: integer
                        example: 805
                        default: 0
                      name:
                        type: string
                        example: Custodian
                      shortName:
                        type: string
                        example: Custodian
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Employers
  /employers/{employerId}/departments:
    post:
      summary: /employers/{employerId}/departments
      description: 'Use this endpoint to create a new Department in the current context.


        Accepts a standard Department object with no read-only values specified. The `name` of the department must be unique to the Employer, and if supplied, the `parentDepartmentId` must already exist for the specified Employer.


        In the example below, we’re creating a Department called *Human Resources* which is a child of `parentDepartmentId 135`.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and a Department object with `departmentId` populated with the integer ID of the created Department in the response body. It also sets the **Location** header to the location of the Department.


        If the specified Employer does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: employers-employerid-deparments
      parameters:
      - name: employerId
        in: path
        description: Required; unique identifier for the Employer
        schema:
          type: integer
          format: int32
          default: 671
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Human Resources
                parentDepartmentId:
                  type: string
                  default: '135'
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"departmentId\":234,\n  \"name\": \"Human Resources\",\n  \"parentDepartmentId\": 135,\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
