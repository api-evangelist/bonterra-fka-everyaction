openapi: 3.2.0
info:
  title: everyaction-8 Employers API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: Employers
paths:
  /employers:
    get:
      summary: /employers
      description: 'Use this endpoint to retrieve all Employers available in the current context.


        By default, this endpoint returns 250 records per request. A maximum of 500 records per request is allowed via the `$top` parameter.'
      operationId: get-employers
      parameters:
      - name: isMyOrganization
        in: query
        description: Optional; filters results by whether an Employer is designated `isMyOrganization`
        schema:
          type: boolean
          default: false
      - name: $expand
        in: query
        description: 'Optional; comma delimited list of expansion properties: `parent`, `phones`'
        schema:
          type: string
          default: parent
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\"items\":[\n  {\n  \"employerId\": 671,\n  \"name\": \"Eastside Regional Medical Center\",\n  \"shortName\": \"Eastside Regional\",\n  \"parentOrganization\": {\n      \"organizationId\": 65,\n      \"organizationType\": null,\n      \"name\": \"United Healthcare Systems\",\n      \"shortName\": \"United Healthcare\",\n      \"website\": null,\n      \"parentOrganization\": null\n  },\n  \"website\": \"https://eastsideregionalmc.com\",\n  \"isMyOrganization\": true,\n  \"phones\": [],\n  \"departments\": [],\n  \"jobClasses\": [],\n  \"worksites\": [],\n  \"shifts\": []\n\t}\n]\n\"nextPageLink\":NULL\n\"count\":0\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Employers
    post:
      summary: /employers
      description: 'Use this endpoint to create a new Employer.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and an Employer object with the integer ID of the created Employer in the response body and any associated Worksites. If no Worksite was specified, a default Worksite will be created. It also sets the **Location** header to the location of the Employer.'
      operationId: post-employers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employer:
                  type: object
                  description: Accepts a standard Employer object with no read-only values specified.
                  properties: {}
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"employerId\": 671,\n  \"name\": \"Eastside Regional Medical Center\",\n  \"shortName\": \"Eastside Regional\",\n  \"parentOrganization\": {\n      \"organizationId\": 65,\n      \"organizationType\": null,\n      \"name\": \"United Healthcare Systems\",\n      \"shortName\": \"United Healthcare\",\n      \"website\": null,\n      \"parentOrganization\": null\n  },\n  \"website\": \"https://eastsideregionalmc.com\",\n  \"isMyOrganization\": true,\n  \"phones\": [],\n  \"departments\": [],\n  \"jobClasses\": [],\n  \"worksites\": [],\n  \"shifts\": []\n}"
              schema:
                type: object
                properties:
                  employerId:
                    type: integer
                    example: 671
                    default: 0
                  name:
                    type: string
                    example: Eastside Regional Medical Center
                  shortName:
                    type: string
                    example: Eastside Regional
                  parentOrganization:
                    type: object
                    properties:
                      organizationId:
                        type: integer
                        example: 65
                        default: 0
                      organizationType: {}
                      name:
                        type: string
                        example: United Healthcare Systems
                      shortName:
                        type: string
                        example: United Healthcare
                      website: {}
                      parentOrganization: {}
                  website:
                    type: string
                    example: https://eastsideregionalmc.com
                  isMyOrganization:
                    type: boolean
                    example: true
                    default: true
                  phones:
                    type: array
                  departments:
                    type: array
                  jobClasses:
                    type: array
                  worksites:
                    type: array
                  shifts:
                    type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Employers
  /employers/{employerId}:
    get:
      summary: /employers/{employerId}
      description: Use this endpoint to retrieve the details of a specific Employer.
      operationId: employers-employerid
      parameters:
      - name: employerId
        in: path
        description: Required; unique identifier of the Employer to be retrieved
        schema:
          type: integer
          format: int32
          default: 671
        required: true
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of [expansion](https://everyaction.readme.io/reference#expansion) properties: `bargainingUnits`, `departments`, `jobClasses`, `parent`, `phones`, `shifts`, `worksites`'
        schema:
          type: string
          default: parent,phones
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"employerId\": 671,\n  \"name\": \"Eastside Regional Medical Center\",\n  \"shortName\": \"Eastside Regional\",\n  \"parentOrganization\": {\n      \"organizationId\": 65,\n      \"organizationType\": null,\n      \"name\": \"United Healthcare Systems\",\n      \"shortName\": \"United Healthcare\",\n      \"website\": null,\n      \"parentOrganization\": null\n  },\n  \"website\": \"https://eastsideregionalmc.com\",\n  \"isMyOrganization\": true,\n  \"phones\": [\n    {\n      \"organizationPhoneId\": 10,\n      \"organizationId\": 671,\n      \"phoneSourceId\": 2,\n      \"phoneType\": \"W\",\n      \"phone\": \"2025551212\",\n      \"dialingPrefix\": null,\n      \"countryCode\": null,\n      \"confidenceLevel\": null\n    }\n  ],\n  \"departments\": [],\n  \"bargainingUnits\": [],\n  \"jobClasses\": [],\n  \"worksites\": [],\n  \"shifts\": []\n}"
              schema:
                type: object
                properties:
                  employerId:
                    type: integer
                    example: 671
                    default: 0
                  name:
                    type: string
                    example: Eastside Regional Medical Center
                  shortName:
                    type: string
                    example: Eastside Regional
                  parentOrganization:
                    type: object
                    properties:
                      organizationId:
                        type: integer
                        example: 65
                        default: 0
                      organizationType: {}
                      name:
                        type: string
                        example: United Healthcare Systems
                      shortName:
                        type: string
                        example: United Healthcare
                      website: {}
                      parentOrganization: {}
                  website:
                    type: string
                    example: https://eastsideregionalmc.com
                  isMyOrganization:
                    type: boolean
                    example: true
                    default: true
                  phones:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationPhoneId:
                          type: integer
                          example: 10
                          default: 0
                        organizationId:
                          type: integer
                          example: 671
                          default: 0
                        phoneSourceId:
                          type: integer
                          example: 2
                          default: 0
                        phoneType:
                          type: string
                          example: W
                        phone:
                          type: string
                          example: '2025551212'
                        dialingPrefix: {}
                        countryCode: {}
                        confidenceLevel: {}
                  departments:
                    type: array
                  bargainingUnits:
                    type: array
                  jobClasses:
                    type: array
                  worksites:
                    type: array
                  shifts:
                    type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Employers
    patch:
      summary: /employers/{employerId}
      description: Changes the `isMyOrganization` status of an Employer.
      operationId: patch-employers-employerid
      parameters:
      - name: employerId
        in: path
        description: Required; unique identifier of the Employer to be updated
        schema:
          type: integer
          format: int32
          default: 671
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isMyOrganization:
                  type: boolean
                  description: The new `isMyOrganization` status
                  default: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"employerId\": 671,\n  \"name\": \"Eastside Regional Medical Center\",\n  \"shortName\": \"Eastside Regional\",\n  \"parentOrganization\": {\n      \"organizationId\": 65,\n      \"organizationType\": null,\n      \"name\": \"United Healthcare Systems\",\n      \"shortName\": \"United Healthcare\",\n      \"website\": null,\n      \"parentOrganization\": null\n  },\n  \"website\": \"https://eastsideregionalmc.com\",\n  \"isMyOrganization\": true,\n  \"phones\": [\n    {\n      \"organizationPhoneId\": 10,\n      \"organizationId\": 671,\n      \"phoneSourceId\": 2,\n      \"phoneType\": \"W\",\n      \"phone\": \"2025551212\",\n      \"dialingPrefix\": null,\n      \"countryCode\": null,\n      \"confidenceLevel\": null\n    }\n  ],\n  \"departments\": [],\n  \"bargainingUnits\": [],\n  \"jobClasses\": [],\n  \"worksites\": [],\n  \"shifts\": []\n}"
              schema:
                type: object
                properties:
                  employerId:
                    type: integer
                    example: 671
                    default: 0
                  name:
                    type: string
                    example: Eastside Regional Medical Center
                  shortName:
                    type: string
                    example: Eastside Regional
                  parentOrganization:
                    type: object
                    properties:
                      organizationId:
                        type: integer
                        example: 65
                        default: 0
                      organizationType: {}
                      name:
                        type: string
                        example: United Healthcare Systems
                      shortName:
                        type: string
                        example: United Healthcare
                      website: {}
                      parentOrganization: {}
                  website:
                    type: string
                    example: https://eastsideregionalmc.com
                  isMyOrganization:
                    type: boolean
                    example: true
                    default: true
                  phones:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationPhoneId:
                          type: integer
                          example: 10
                          default: 0
                        organizationId:
                          type: integer
                          example: 671
                          default: 0
                        phoneSourceId:
                          type: integer
                          example: 2
                          default: 0
                        phoneType:
                          type: string
                          example: W
                        phone:
                          type: string
                          example: '2025551212'
                        dialingPrefix: {}
                        countryCode: {}
                        confidenceLevel: {}
                  departments:
                    type: array
                  bargainingUnits:
                    type: array
                  jobClasses:
                    type: array
                  worksites:
                    type: array
                  shifts:
                    type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n    \"code\":\"FORBIDDEN\"\n    \"text\":\"Access to this resource is restricted.\"\n    }\n  ]\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Employers
  /employers/{employerId}/bargainingUnits/{bargainingUnitId}:
    delete:
      summary: /employers/{employerId}/bargainingUnits/{bargainingUnitId}
      description: 'Use this to delete the relationship or link between an Employer and a BargainingUnit. This does not update the Employer nor BargainingUnit, but rather the relation between them.


        If successful, the endpoint will respond with HTTP Status Code `200 OK`.


        If the specified Employer-BargainingUnit relationship does not exist or is not accessible, this endpoint will return with an error message with Status Code `400 Bad Request`.'
      operationId: employersemployeridbargainingunitsbargainingunitiddelete
      parameters:
      - name: employerId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      - name: bargainingUnitId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"BAD_REQUEST\",\n            \"text\": \"BargainingUnit: 0 does not exist or is not accessible by your account.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: BAD_REQUEST
                        text:
                          type: string
                          example: 'BargainingUnit: 0 does not exist or is not accessible by your account.'
      deprecated: false
      tags:
      - Employers
    post:
      summary: /employers/{employerId}/bargainingUnits/{bargainingUnitId}
      description: 'Use this endpoint to link a master Bargaining Unit to an existing Employer.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and a composite Employer Bargaining Unit object in the response body.


        If the specified Employer or Bargaining Unit does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: employers-employerid-bargainingunits-bargainingunitid
      parameters:
      - name: employerId
        in: path
        description: Required; unique identifier for the Employer
        schema:
          type: integer
          format: int32
          default: 671
        required: true
      - name: bargainingUnitId
        in: path
        description: Required; unique identifier for the master [Bargaining Unit](https://docs.everyaction.com/reference/bargaining-units)
        schema:
          type: integer
          format: int32
          default: 35
        required: true
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"employerBargainingUnitId\": 98,\n  \"bargainingUnit\": {\n    \"bargainingUnitId\": 35,\n    \"name\": \"Maintenance\"\n  }\n}"
              schema:
                type: object
                properties:
                  employerBargainingUnitId:
                    type: integer
                    example: 98
                    default: 0
                  bargainingUnit:
                    type: object
                    properties:
                      bargainingUnitId:
                        type: integer
                        example: 35
                        default: 0
                      name:
                        type: string
                        example: Maintenance
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Employers
  /employers/{employerId}/bargainingUnits/{bargainingUnitId}/jobClasses/{jobClassId}:
    delete:
      summary: /employers/{employerId}/bargainingUnits/{bargainingUnitId}/jobClasses/{jobClassI…
      description: 'Use this to delete the relationship or link between an Employer, BargainingUnit and JobClass. This does not update the Employer, BargainingUnit nor JobClass, but rather the relation between them.


        If successful, the endpoint will respond with HTTP Status Code `200 OK`.


        If the specified Employer-BargainingUnit-JobClass relationship does not exist or is not accessible, this endpoint will return with an error message with Status Code `400 Bad Request`.'
      operationId: employersemployeridbargainingunitsbargainingunitidjobclassesjobclassiddelete
      parameters:
      - name: employerId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      - name: bargainingUnitId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      - name: jobClassId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"BAD_REQUEST\",\n            \"text\": \"JobClass: 0 does not exist or is not accessible by your account.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: BAD_REQUEST
                        text:
                          type: string
                          example: 'JobClass: 0 does not exist or is not accessible by your account.'
      deprecated: false
      tags:
      - Employers
    post:
      summary: /employers/{employerId}/bargainingUnits/{bargainingUnitId}/jobClasses/{jobClassI…
      description: 'Use this endpoint to link a master Job Class to an existing Employer and Bargaining Unit.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and a composite Employer Bargaining Unit Job Class object in the response body.


        If the specified Employer, Bargaining Unit, or Job Class does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
