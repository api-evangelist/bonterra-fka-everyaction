paths:
  /surveyQuestions:
    post:
      summary: /surveyQuestions
      description: Use this endpoint to create a new Survey Question in the current context
      operationId: create-surveyquestion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - cycle
              - name
              - nameOtherLanguage
              - mediumName
              - mediumNameOtherLanguage
              - shortName
              - shortNameOtherLanguage
              - scriptQuestion
              - scriptQuestionOtherLanguage
              - status
              - scope
              - responses
              properties:
                type:
                  type: string
                cycle:
                  type: string
                  description: A year in the format `YYYY`
                name:
                  type: string
                nameOtherLanguage:
                  type: string
                mediumName:
                  type: string
                mediumNameOtherLanguage:
                  type: string
                shortName:
                  type: string
                shortNameOtherLanguage:
                  type: string
                scriptQuestion:
                  type: string
                scriptQuestionOtherLanguage:
                  type: string
                status:
                  type: string
                  description: One of `Active` (default), `Archived`, and `Inactive`.
                  default: Active
                scope:
                  type: string
                  description: Either 'Public' or 'Private'.  Only applicable if Private Survey Questions are enabled
                  default: Public
                responses:
                  type: array
                  items:
                    properties:
                      surveyResponseId:
                        type: string
                      name:
                        type: string
                      nameOtherLanguage:
                        type: string
                      mediumName:
                        type: string
                      mediumNameOtherLanguage:
                        type: string
                      shortName:
                        type: string
                      shortNameOtherLanguage:
                        type: string
                    required:
                    - shortNameOtherLanguage
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Survey Questions
    get:
      summary: /surveyQuestions
      description: Use this endpoint to retrieve all Survey Questions that are available in the current context.
      operationId: surveyquestions
      parameters:
      - name: statuses
        in: query
        description: Comma-delimited list of *statuses* of Survey Questions. One or more of `Active` (default), `Archived`, and `Inactive`.
        schema:
          type: string
          default: Active,Archived
      - name: name
        in: query
        description: Filters to Survey Questions with names that start with the given input
        schema:
          type: string
          default: John
      - name: type
        in: query
        description: Filters to Survey Questions of the given type
        schema:
          type: string
          default: Candidate
      - name: question
        in: query
        description: Filters to Survey Questions with script questions that contain the given input
        schema:
          type: string
          default: Will you vote for John Kerry in the upcoming Senate race?
      - name: cycle
        in: query
        description: A year in the format `YYYY`; filters to Survey Questions with the given cycle
        schema:
          type: integer
          format: int32
          default: 2020
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
          default: 40
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"surveyQuestionId\": 54945,\n      \"type\": \"Candidate\",\n      \"cycle\": 2010,\n      \"name\": \"John Kerry senate\",\n      \"mediumName\": \"Kerry\",\n      \"shortName\": \"Kerr\",\n      \"scriptQuestion\": \"Will you vote for John Kerry in the upcoming Senate race?\",\n      \"status\": \"Archived\",\n      \"responses\": [\n        {\n          \"surveyResponseId\": 245998,\n          \"name\": \"1 Strong Kerry\",\n          \"mediumName\": \"1\",\n          \"shortName\": \"K\"\n        },\n        {\n          \"surveyResponseId\": 245999,\n          \"name\": \"2 Leaning Kerry\",\n          \"mediumName\": \"2\",\n          \"shortName\": \"k\"\n        }\n      ]\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        surveyQuestionId:
                          type: integer
                          example: 54945
                          default: 0
                        type:
                          type: string
                          example: Candidate
                        cycle:
                          type: integer
                          example: 2010
                          default: 0
                        name:
                          type: string
                          example: John Kerry senate
                        mediumName:
                          type: string
                          example: Kerry
                        shortName:
                          type: string
                          example: Kerr
                        scriptQuestion:
                          type: string
                          example: Will you vote for John Kerry in the upcoming Senate race?
                        status:
                          type: string
                          example: Archived
                        responses:
                          type: array
                          items:
                            type: object
                            properties:
                              surveyResponseId:
                                type: integer
                                example: 245998
                                default: 0
                              name:
                                type: string
                                example: 1 Strong Kerry
                              mediumName:
                                type: string
                                example: '1'
                              shortName:
                                type: string
                                example: K
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Survey Questions
  /surveyQuestions/{surveyQuestionId}:
    put:
      summary: /surveyQuestions/{surveyQuestionId}
      description: Use this endpoint to update a Survey Question in the current context
      operationId: surveyquestionssurveyquestionid-1
      parameters:
      - name: surveyQuestionId
        in: path
        description: Unique identifier for a specific Survey Question. This is either an integer or a VAN encoded identifier (e.g., `EID28CG`).
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - surveyQuestionId
              - type
              - cycle
              - name
              - nameOtherLanguage
              - mediumName
              - mediumNameOtherLanguage
              - shortName
              - shortNameOtherLanguage
              - scriptQuestion
              - scriptQuestionOtherLanguage
              - status
              - responses
              properties:
                surveyQuestionId:
                  type: string
                  description: Unique identifier for a specific Survey Question. This is either an integer or a VAN encoded identifier (e.g., `EID28CG`).
                type:
                  type: string
                cycle:
                  type: string
                  description: A year in the format `YYYY`
                name:
                  type: string
                nameOtherLanguage:
                  type: string
                mediumName:
                  type: string
                mediumNameOtherLanguage:
                  type: string
                shortName:
                  type: string
                shortNameOtherLanguage:
                  type: string
                scriptQuestion:
                  type: string
                scriptQuestionOtherLanguage:
                  type: string
                status:
                  type: string
                  description: One of `Active` (default), `Archived`, and `Inactive`.
                  default: Active
                scope:
                  type: string
                  description: Either 'Public' or 'Private'.  Only applicable if Private Survey Questions are enabled
                  default: Public
                responses:
                  type: array
                  items:
                    properties:
                      surveyResponseId:
                        type: string
                      name:
                        type: string
                      nameOtherLanguage:
                        type: string
                      mediumName:
                        type: string
                      mediumNameOtherLanguage:
                        type: string
                      shortName:
                        type: string
                      shortNameOtherLanguage:
                        type: string
                    required:
                    - shortNameOtherLanguage
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Survey Questions
    get:
      summary: /surveyQuestions/{surveyQuestionId}
      description: 'Use this endpoint to retrieve information about a specific Survey Question (and its set of Survey Responses) available in the current context.


        A standard Survey Question object, if found.


        If the specified Survey Question does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: surveyquestionssurveyquestionid
      parameters:
      - name: surveyQuestionId
        in: path
        description: Unique identifier for a specific Survey Question. This is either an integer or a VAN encoded identifier (e.g., `EID28CG`).
        schema:
          type: string
          default: '54949'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"surveyQuestionId\": 54949,\n  \"type\": \"Candidate\",\n  \"cycle\": 2010,\n  \"name\": \"Maddow for Senate\",\n  \"mediumName\": \"Maddow\",\n  \"shortName\": \"MS\",\n  \"scriptQuestion\": \"In the upcoming race for US Senate, do you plan to vote for Republican Scott Brown or Democrat Rachel Maddow?\",\n  \"status\": \"Active\",\n  \"responses\": [\n    {\n      \"surveyResponseId\": 246016,\n      \"name\": \"1 - Strong Maddow\",\n      \"mediumName\": \"1\",\n      \"shortName\": \"1\"\n    },\n    {\n      \"surveyResponseId\": 246017,\n      \"name\": \"2 - Leaning Maddow\",\n      \"mediumName\": \"2\",\n      \"shortName\": \"2\"\n    },\n    {\n      \"surveyResponseId\": 246018,\n      \"name\": \"3 - Undecided\",\n      \"mediumName\": \"3\",\n      \"shortName\": \"3\"\n    }\n   ]\n}"
              schema:
                type: object
                properties:
                  surveyQuestionId:
                    type: integer
                    example: 54949
                    default: 0
                  type:
                    type: string
                    example: Candidate
                  cycle:
                    type: integer
                    example: 2010
                    default: 0
                  name:
                    type: string
                    example: Maddow for Senate
                  mediumName:
                    type: string
                    example: Maddow
                  shortName:
                    type: string
                    example: MS
                  scriptQuestion:
                    type: string
                    example: In the upcoming race for US Senate, do you plan to vote for Republican Scott Brown or Democrat Rachel Maddow?
                  status:
                    type: string
                    example: Active
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        surveyResponseId:
                          type: integer
                          example: 246016
                          default: 0
                        name:
                          type: string
                          example: 1 - Strong Maddow
                        mediumName:
                          type: string
                          example: '1'
                        shortName:
                          type: string
                          example: '1'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Survey Questions
