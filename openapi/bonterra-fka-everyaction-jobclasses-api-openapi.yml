info:
  title: everyaction-8 Job Classes API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: JobClasses
paths:
  /jobClasses:
    get:
      summary: /jobClasses
      description: Use this endpoint to retrieve all Job Classes available in the current context.
      operationId: jobclasses
      parameters:
      - name: $top
        in: query
        description: A limit on the number of records to return in a single request, similar to a page size. This can be a value between 1 and the maximum `$top` value for a particular endpoint, typically 200. If no `$top` value is specified, an endpoint’s default `$top` size is used, typically 50. If an endpoint has a default `$top` but no maximum `$top`, you can retrieve all values by sending the `$top` parameter with no values (e.g., `resources?$top=`). The maximum and default values are documented for each endpoint.
        schema:
          type: integer
          format: int32
          default: 40
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\":[\n    {\n      \"jobClassId\": 123,\n      \"name\": \"Registered Nurse\",\n      \"shortName\": \"RN\"\n\t\t},\n    {\n      \"jobClassId\": 178,\n      \"name\": \"Engineer\",\n      \"shortName\": \"EN\"\n    }\n  ]\n  \"nextPageLink\":NULL\n  \"count\":2\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - JobClasses
    post:
      summary: /jobClasses
      description: 'Use this endpoint to create a new Job Class.


        Accepts a standard Job Class object with no read-only values specified.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and a Job Class object with the integer ID of the created Job Class in the response body. It also sets the Location header to the location of the Job Class.'
      operationId: jobclasses-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required; name for the Job Class
                  default: Fishmonger
                shortName:
                  type: string
                  description: Required; short name for the Job Class
                  default: FM
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"jobClassId\": 321,\n  \"name\": \"Fishmonger\",\n  \"shortName\": \"FM\"\n}"
              schema:
                type: object
                properties:
                  jobClassId:
                    type: integer
                    example: 321
                    default: 0
                  name:
                    type: string
                    example: Fishmonger
                  shortName:
                    type: string
                    example: FM
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - JobClasses
  /jobClasses/{jobClassId}:
    get:
      summary: /jobClasses/{jobClassId}
      description: 'Use this endpoint to retrieve the details of a specific Job Class.


        *Response*


        Returns a standard Job Class object, if found.


        If the specified Job Class does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: jobclassesjobclassid
      parameters:
      - name: jobClassId
        in: path
        description: Required; unique identifier of the Job Class to be retrieved
        schema:
          type: integer
          format: int32
          default: 123
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"jobClassId\": 123,\n  \"name\": \"Registered Nurse\",\n  \"shortName\": \"RN\"\n}"
              schema:
                type: object
                properties:
                  jobClassId:
                    type: integer
                    example: 123
                    default: 0
                  name:
                    type: string
                    example: Registered Nurse
                  shortName:
                    type: string
                    example: RN
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - JobClasses
