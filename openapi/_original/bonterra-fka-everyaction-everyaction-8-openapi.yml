                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
                        properties:
                          type: array
                          items:
                            type: string
                            example: propertyName
      deprecated: false
