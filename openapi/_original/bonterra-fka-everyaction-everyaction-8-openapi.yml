  /codes:
    get:
      summary: /codes
      description: 'Use this endpoint to find Codes available in the current context using a number of filter options.


        By default, this endpoint returns 50 records per request. A maximum of 200 records per request is allowed via the `$top` parameter.


        The only valid expansion property is: `supportedEntities`.


        The only valid `orderby` property is: `dateModified`.'
      operationId: get-codes
      parameters:
      - name: supportedEntities
        in: query
        description: Filters to Codes that are searchable or applicable to this comma separated list of Entities
        schema:
          type: string
          default: Organizations,Events,Locations
      - name: name
        in: query
        description: Filters to Codes with names that contain the given input
        schema:
          type: string
          default: Labor
      - name: parentCodeId
        in: query
        description: Filters to Codes that are direct children of the given Code ID
        schema:
          type: integer
          format: int32
          default: 20513
      - name: codeType
        in: query
        description: Filters to Codes which match the specified Code Type; must be a Code Type available to the API key, as determined by `GET /codeTypes`
        schema:
          type: string
          default: Tag
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of expansion properties: `supportedEntities`'
        schema:
          type: string
          default: supportedEntities
      - name: $orderby
        in: query
        description: 'Optional; sorts results in ascending (`asc`) or descending (`desc`) order by a comma-delimited list of properties: `dateModified`. Note that a space is required between the property and `asc` or `desc`.'
        schema:
          type: string
          default: dateModified desc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"codeId\": 20515,\n      \"parentCodeId\": 20513,\n      \"name\": \"Labor\",\n      \"codeType\": \"Tag\",\n      \"dateCreated\": \"2015-04-05T12:59:00Z\",\n      \"dateModified\": \"2015-05-01T09:59:00Z\",\n      \"supportedEntities\": [\n        {\n          \"name\": \"Organizations\",\n          \"isSearchable\": true,\n          \"isApplicable\": false\n        },\n        {\n          \"name\": \"Events\",\n          \"isSearchable\": true,\n          \"isApplicable\": true\n        },\n        {\n          \"name\": \"Locations\",\n          \"isSearchable\": true,\n          \"isApplicable\": false\n        }\n      ]\n    }\n  ],\n  \"nextPageLink\": \"https://api.securevan.com:443/v4/codes?parentCodeId=20513&$expand=supportedEntities&$top=1&$skip=1\",\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
