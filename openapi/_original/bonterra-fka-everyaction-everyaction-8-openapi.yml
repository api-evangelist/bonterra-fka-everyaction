    post:
      summary: /bargainingUnits
      description: 'Use this endpoint to create a new Bargaining Unit.


        Accepts a standard [Bargaining Unit](https://docs.everyaction.com/reference/bargaining-units) object with no read-only values specified.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and a Bargaining Unit object with the integer ID of the created Bargaining Unit in the response body. It also sets the Location header to the [location](https://docs.everyaction.com/reference/bargainingunitsbargainingunitid) of the Bargaining Unit.'
      operationId: post-bargainingunits
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required; name for the Bargaining Unit
                  default: Healthcare Professionals
                shortName:
                  type: string
                  description: Required; short name for the Bargaining Unit
                  default: Healthcare Prof
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"bargainingUnitId\": 99,\n  \"name\": \"Healthcare Professionals\",\n  \"shortName\": \"Healthcare Prof\"\n}"
              schema:
                type: object
                properties:
                  bargainingUnitId:
                    type: integer
                    example: 99
                    default: 0
                  name:
                    type: string
                    example: Healthcare Professionals
                  shortName:
                    type: string
                    example: Healthcare Prof
        '400':
          description: '400'
