  /bulkImportJobs:
    post:
      summary: /bulkImportJobs
      description: 'Initiates a bulk import job by specifying the url for a zipped, delimited file, of no more than 20MB. A bulk import job can update and/or create multiple data types including, but not limited to, `Contacts`, `Contributions`, and `ActivistCodes`. For a complete list of supported types, see the [resources](https://docs.everyaction.com/reference/bulk-import#bulkimportjobsresources) endpoint.


        The zipped file can contain both update and creation records for a single resource type. It can also contain a header row. The header row is only there as a debugging aid, and is not used by the import process. See Property `hasHeader` in the [File](https://docs.everyaction.com/reference/file-loading-jobs) object for more information on headers.


        When the bulk import job is updating resources, if any non-required columns are left blank, those fields will not be updated. This process cannot be used to delete information; it can only update or create.'
      operationId: bulkimportjobs
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"jobId\": 998877\n}"
              schema:
                type: object
                properties:
                  jobId:
                    type: integer
                    example: 998877
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\",\n            \"properties\": [\n                \"propertyName\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
