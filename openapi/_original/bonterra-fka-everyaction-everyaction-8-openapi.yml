paths:
  /activistCodes:
    get:
      summary: /activistCodes
      description: 'Use this endpoint to retrieve all Activist Codes that are available in the current context.


        This endpoint accepts [standard pagination parameters](https://docs.everyaction.com/reference/pagination) and returns a standard paginated response.


        By default, this endpoint returns 50 records per request. A maximum of 200 records per request is allowed via the `$top` parameter.'
      operationId: activistcodes
      parameters:
      - name: statuses
        in: query
        description: Comma-delimited list of *statuses* of Activist Codes. One or more of `Active` (default), `Archived`, and `Inactive`.
        schema:
          type: string
          default: Active
      - name: name
        in: query
        description: Filters to Activist Codes with names that start with the given input
        schema:
          type: string
          default: Precinct
      - name: type
        in: query
        description: Filters to Activist Codes of the given type
        schema:
          type: string
          default: Volunteer
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"activistCodeId\": 3214,\n      \"type\": \"Volunteer\",\n      \"name\": \"Precinct Captain\",\n      \"mediumName\": \"P Capt\",\n      \"shortName\": \"PC\",\n      \"description\": \"Precinct Captain\",\n      \"scriptQuestion\": \"Would you be willing to be a Precinct Captain?\",\n      \"status\": \"Active\"\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        activistCodeId:
                          type: integer
                          example: 3214
                          default: 0
                        type:
                          type: string
                          example: Volunteer
                        name:
                          type: string
                          example: Precinct Captain
                        mediumName:
                          type: string
                          example: P Capt
                        shortName:
                          type: string
                          example: PC
                        description:
                          type: string
                          example: Precinct Captain
                        scriptQuestion:
                          type: string
                          example: Would you be willing to be a Precinct Captain?
                        status:
                          type: string
                          example: Active
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
