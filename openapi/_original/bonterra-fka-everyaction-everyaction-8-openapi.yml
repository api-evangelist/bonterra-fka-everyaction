                          example: '2015-04-05T12:59:00Z'
                        dateModified:
                          type: string
                          example: '2015-05-01T09:59:00Z'
                        supportedEntities:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: Organizations
                              isSearchable:
                                type: boolean
                                example: true
                                default: true
                              isApplicable:
                                type: boolean
                                example: false
                                default: true
                  nextPageLink:
                    type: string
                    example: https://api.securevan.com:443/v4/codes?parentCodeId=20513&$expand=supportedEntities&$top=1&$skip=1
                  count:
                    type: integer
                    example: 1
                    default: 0
