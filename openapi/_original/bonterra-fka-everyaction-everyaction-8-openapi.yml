  /bargainingUnits:
    get:
      summary: /bargainingUnits
      description: 'Use this endpoint to retrieve all Bargaining Units available in the current context.


        By default, this endpoint returns 50 records per request. A maximum of 200 records per request is allowed via the `$top` parameter.


        This endpoint responds with a [standard paged response](https://docs.everyaction.com/reference/pagination) of [Bargaining Units] (ref:bargaining-units).'
      operationId: bargainingunits
      parameters:
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  {\n    \"items\": [\n      {\n        \"bargainingUnitId\": 99,\n        \"name\": \"Healthcare Professionals\",\n        \"shortName\": \"Healthcare Prof\"\n      }\n    ],\n    \"nextPageLink\": null,\n    \"count\": 1\n  }\n}"
        '400':
