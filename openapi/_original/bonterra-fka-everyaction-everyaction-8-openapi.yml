      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              - designation
              - startDate
              - frequency
              - amount
              - paymentType
              properties:
                contact:
                  type: object
                  description: The [Person](https://docs.everyaction.com/reference/people) who contributed
                  properties:
                    vanId:
                      type: string
                      default: '10005165'
                designation:
                  type: object
                  description: The financial entity which will receive funds associated with this Commitment.
                  properties:
                    designationId:
                      type: integer
                      default: 18754
                      format: int32
                startDate:
                  type: string
                  description: The date the Recurring Commitment started. The startDate must be the same or later than the current US Eastern Time date.
                  default: '2025-01-01'
                  format: date
                endDate:
                  type: string
                  description: The date the Recurring Commitment ended. If present, endDate must be later than startDate.
                  default: '2026-01-01'
                  format: date
                frequency:
                  type: string
                  description: The frequency of each recurring commitment installment.
                  enum:
                  - Weekly
                  - EveryTwoWeeks
                  - EveryFourWeeks
                  - Monthly
                  - TwiceMonthly
                  - Quarterly
                  - Annually
                  - TwiceAnnually
                amount:
                  type: number
                  description: Decimal monetary amount of each Recurring Commitment installment.
                  default: 10
                  format: double
                paymentType:
                  type: string
                  description: Payment method by which the funds will be contributed
                  enum:
                  - Check
                  - MoneyOrder
                  - Cash
                  - CreditCard
                  - InKind
                  - Unknown
                  - ElectronicFundsTransfer
                  - ElectronicPaySystem
                  - Stock
                  - ApplePay
                codes:
                  type: array
                  description: An array of zero or one [Code](https://docs.everyaction.com/reference/codes) to apply to the contribution. Contributions may not have more than one Code applied, and if a Code is applied, it must be a Source Code.
                  items:
                    properties:
                      parentCodeId:
                        type: integer
                        default: 1002316
                        format: int32
                      name:
                        type: string
                        default: Labor
                      description:
                        type: string
                        default: The tag for describing Labor
                      supportedEntities:
                        type: array
                        items:
                          properties:
                            name:
                              type: string
                              default: Events
                            isSearchable:
                              type: boolean
                              default: true
                            isApplicable:
                              type: boolean
                              default: true
                          type: object
                      codeType:
                        type: string
                        default: Tag
