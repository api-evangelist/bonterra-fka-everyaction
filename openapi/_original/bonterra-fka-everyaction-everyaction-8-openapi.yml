  /contributions/{contributionId}/attributions/{vanId}:
    put:
      summary: /contributions/{contributionId}/attributions/{vanId}
      description: 'Create or update an Attribution record on the given Contribution for a Person.


        If there is an existing Attribution for the given Person on the given Contribution, it will be updated to match the Attribution provided with this request. If there is not an existing Attribution, one will be created.


        Accepts an [Attribution](https://docs.everyaction.com/reference/contributions#attributions) object. The `vanId` property of the Attribution object must match the value of the `vanId` parameter provided in the route. If `amountAttributed` is not provided, it will default to the remaining amount of the Contribution. If `attributionType` is not provided, it will default to `DefaultAttribution`.



        If the specified Contribution or Person does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` if an existing Attribution has been updated. If a new Attribution has been created, this endpoint responds with HTTP Status Code `201 Created`.'
      operationId: contributions-contributionid-attributions-vanid
      parameters:
      - name: contributionId
        in: path
        description: Unique contribution identifier available in the current context
        schema:
          type: integer
          format: int32
          default: 4482
        required: true
      - name: vanId
        in: path
        description: Unique person identifier available in the current context
        schema:
          type: string
          default: '215501'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vanId:
                  type: string
                  description: Unique identifier for the attributed contact. Represents contacts who acted as fundraisers, rather than contributors.
                  default: '215501'
                amountAttributed:
                  type: string
                  description: Optional; The amount of the attribution. Values that have more than 2 digits after the decimal point will not be accepted. If no amount is provided, default to contribution amount.
                  default: '100.00'
                attributionType:
                  type: string
                  description: Optional; A string representing the attribution type. See below for valid values of Attribution Type. If no type is provided, default to “DefaultAttribution” type
                  default: BoardMemberGiving
                dateThanked:
                  type: string
                  description: Optional; The date on which the attributed contact was thanked for the contribution.
                  default: '2019-10-08'
                  format: date
                notes:
                  type: string
                  description: Optional; A note describing the attribution. Max length of 100 characters.
                  default: This will be created or updated
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
