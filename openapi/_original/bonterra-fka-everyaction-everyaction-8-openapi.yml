  /people/{personIdType}:{personId}/canvassResponses:
    post:
      summary: /people/{personIdType}:{personId}/canvassResponses
      description: This endpoint is the same as [POST /people/{vanId}/canvassResponses](https://docs.everyaction.com/reference/people#peoplevanidcanvassresponses) but uses external IDs rather than VANIDs.
      operationId: people-personidtype-personid-canvassresponses
      parameters:
      - name: personIdType
        in: path
        description: Required; a known person identifier type available in the current context
        schema:
          type: string
          default: GWID
        required: true
      - name: personId
        in: path
        description: Required; an external identifier, URL encoded
        schema:
          type: string
          default: '3'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                canvassContext:
                  type: object
                  description: Optional; describes the context in which this Canvass Response was created
                  properties:
                    contactTypeId:
                      type: integer
                      description: Optional; a valid [Contact Type ID](https://docs.everyaction.com/reference/canvassresponsescontacttypes)
                      format: int32
                    inputTypeId:
                      type: integer
                      description: Optional; a valid [Input Type ID](https://docs.everyaction.com/reference/canvassresponsesinputtypes)  (defaults to `11` → API)
                      default: 11
                      format: int32
                    dateCanvassed:
                      type: string
                      description: Optional; the ISO 8601 formatted date that the canvass attempt was made (defaults to today’s date)
                      format: date
                    phoneId:
                      type: integer
                      description: Optional; the identifier of the phone number that was called when canvassing this person. May result in a phone suppression in the event of certain kinds of Result Codes (e.g., Wrong Number.)
                      format: int32
                    skipMatching:
                      type: boolean
                      description: Optional; if set to `true`, skips matching/de-duping of contact history. Defaults to `false`.
                    omitActivistCodeContactHistory:
                      type: boolean
                      description: Optional; if set to `true`, no contact history record will be created if `responses` contains only Activist Codes
                    phone:
                      type: object
                      description: Optional; describes the context of the phone number where a contact was attempted
                      properties:
                        dialingPrefix:
                          type: string
                          description: The country calling code of the number
                          default: '1'
                        phoneNumber:
                          type: string
                          description: Required when inputTypeId is 1 (Phone) or 37 (SMS); the phone number you are attempting - without calling code/dialing prefix
                          default: 555-555-1234
                        smsOptInStatus:
                          type: string
                          description: 'Optional; Must be one of three values: `I` (Opt-In), `O` (Opt-Out), `U` (Unknown). Please note: phone numbers that have been deactivated by the carrier will be marked with an SMS Opt In Status of "Unknown". This information is updated nightly based on information provided by cell phone carriers.'
                          enum:
                          - I
                          - O
                          - U
                    campaignId:
                      type: integer
                      description: Optional; a valid [Campaign ID](https://docs.everyaction.com/reference/campaigns). Required if `contentId` is also specified.
                      format: int32
                    contentId:
                      type: integer
                      description: Optional; a valid Content ID. If specified, the Content's corresponding Campaign must be specified as `campaignId`.
                      format: int32
                    includeReferenceIdInResponse:
                      type: boolean
                      description: Optional; When set to true, the response body will include a GUID corresponding to the newly created canvass response. This GUID can be used later at GET /people/{vanId}/canvassResponses to retrieve the associated canvassResponseId, which is necessary for patching canvass responses at PATCH /people/{vanId}/canvassResponses/{canvassResponseId}. By default, this parameter is false.
                resultCodeId:
                  type: integer
                  description: Optional; specifies the [Result Code](https://docs.everyaction.com/reference/canvass-responses#canvassresponsesresultcodes) of this Response. If no `resultCodeId` is specified, `responses` must be specified. Conversely, if `responses` are specified, `resultCodeId` must be null (a result of *Canvassed* is implied). The `resultCodeId` must be a valid [Result Code](https://docs.everyaction.com/reference/canvass-responses#canvassresponsesresultcodes) in the current context.
                  default: 205
                  format: int32
                responses:
                  type: array
                  description: Optional; an array of Script Responses. If specified, `resultCodeId` must be null. Each Script Response has a property that determines the response's type. This array can contain multiple types.
                  items:
                    properties:
                      type:
                        type: string
                        description: The `type` of this response dictates the validation requirements of other properties. One of `ActivistCode`, `SurveyResponse`, or `VolunteerActivity`
                        enum:
                        - ActivistCode
                        - SurveyResponse
                        - VolunteerActivity
                      action:
                        type: string
                        description: 'Indicates whether to apply or remove this response from a person (valid for `ActivistCode` and `VolunteerActivity` only). NOTE: when removing a multi-assign Activist Code, include dateCanvassed in the canvassContext array to specify the record.'
                        default: Apply
                        enum:
                        - Apply
                        - Remove
                      activistCodeId:
                        type: integer
                        description: Required if `type` is `ActivistCode`; a valid [Activist Code ID](https://docs.everyaction.com/reference/activist-codes)
                        format: int32
                      surveyQuestionId:
                        type: integer
                        description: Required if `type` is `SurveyResponse`; a valid [Survey Question ID](https://docs.everyaction.com/reference/survey-questions)
                        format: int32
                      surveyResponseId:
                        type: integer
                        description: Required if `type` is `SurveyResponse`; a valid response corresponding to the question specified by `surveyQuestionId`
                        format: int32
                      volunteerActivityId:
                        type: integer
                        description: Required if `type` is `VolunteerActivity`; a valid Volunteer Activity ID
                        format: int32
                    required:
                    - type
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"referenceId\": \"b958d667-8f88-498f-8a2d-559fdd8f145d\"\n}"
              schema:
                type: object
                properties:
                  referenceId:
                    type: string
                    example: b958d667-8f88-498f-8a2d-559fdd8f145d
        '204':
