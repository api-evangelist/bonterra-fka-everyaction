  /bulkImportJobs/{jobId}:
    get:
      summary: /bulkImportJobs/{jobId}
      description: This endpoint returns metadata (including job status) about an existing Bulk Import Job, which is specified by the unique identifier `jobId`.
      operationId: bulkimportjobs-jobid
      parameters:
      - name: jobId
        in: path
        description: unique identifier for a BulkImportJob
        schema:
          type: integer
          format: int32
          default: 75
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 75,\n  \"status\": \"Completed\",\n  \"resourceType\": \"Contacts\",\n  \"resultFileSizeLimitKb\": 5000,\n  \"errors\": [],\n  \"resultFiles\": [\n    {\n      \"url\": \"https://somedomain.com/filename.csv\",\n      \"dateExpired\": \"2019-05-15T08:45:50.2062048-04:00\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 75
                    default: 0
                  status:
                    type: string
                    example: Completed
                  resourceType:
                    type: string
                    example: Contacts
                  resultFileSizeLimitKb:
                    type: integer
                    example: 5000
                    default: 0
                  errors:
                    type: array
                  resultFiles:
                    type: array
                    items:
                      type: object
                      properties:
