        in: query
        description: Must be a valid state or province code (two or three characters)
        schema:
          type: string
      - name: zipOrPostalCode
        in: query
        description: Must be a valid ZIP5 zip code or postal code. For UK clients, this parameter accepts valid partial postcodes (e.g., postcode sector).
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Must be a valid phone number
        schema:
          type: string
      - name: email
        in: query
        schema:
          type: string
      - name: commonName
        in: query
        description: If Organizations-as-Contacts is enabled in your database, matches organizations whose Common Name begins with this value.
        schema:
          type: string
      - name: officialName
        in: query
        description: If Organizations-as-Contacts is enabled in your database, matches organizations whose Official Name begins with this value.
        schema:
          type: string
      - name: contactMode
        in: query
        description: If Organizations-as-Contacts is enabled in your database, filters to records of this type.
        schema:
          type: string
          enum:
          - Person
          - Organization
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
      - name: $skip
        in: query
        schema:
          type: integer
          format: int32
      - name: $expand
        in: query
        description: Valid `$expand` sections are are `Addresses`, `Districts`, `Emails`, and `Phones`.
        schema:
          type: string
      - name: $orderby
        in: query
        description: '`Name asc` and `Name desc` are the only valid `$orderby` arguments'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
