      description: "Result Codes, or contact dispositions, are the result of a contact attempt. For example, *Not Home*, *Wrong Number*, *Moved*, etc. A successful contact interaction yields a Result Code called *Canvassed* which is automatically applied when canvass responses are submitted (e.g., when a Survey Response is recorded). \n\nUnsuccessful contact attempts are what Result Codes are all about. This endpoint returns a list of those response codes available in the current context. Similar to Contact Types, Result Codes’ availability can vary by Input Type and/or Contact Type. For example, *Wrong Number* only makes sense in the context of a *Call* Contact Type. *Moved* only makes sense in the context of a *Walk* Contact Type."
      operationId: canvassresponses-resultcodes
      parameters:
      - name: inputTypeId
        in: query
        description: Optional; filter Result Codes to those available to the given Input Type
        schema:
          type: integer
          format: int32
          default: 11
      - name: contactTypeId
        in: query
        description: Optional; filter Result Codes to those available to the given Contact Type
        schema:
          type: integer
          format: int32
          default: 82
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"resultCodeId\": 18,\n    \"name\": \"Busy\",\n    \"mediumName\": \"Busy\",\n    \"shortName\": \"BZ\"\n  },\n  {\n    \"resultCodeId\": 25,\n    \"name\": \"Disconnected\",\n    \"mediumName\": \"Disc\",\n    \"shortName\": \"WX\"\n  },\n  {\n    \"resultCodeId\": 19,\n    \"name\": \"Left Message\",\n    \"mediumName\": \"LM\",\n    \"shortName\": \"LM\"\n  },\n  {\n    \"resultCodeId\": 20,\n    \"name\": \"Wrong Number\",\n    \"mediumName\": \"Wr#\",\n    \"shortName\": \"WN\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    resultCodeId:
                      type: integer
                      example: 18
                      default: 0
                    name:
                      type: string
                      example: Busy
                    mediumName:
                      type: string
                      example: Busy
                    shortName:
                      type: string
                      example: BZ
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
  /changedEntityExportJobs:
    post:
      summary: /changedEntityExportJobs
      description: 'Create a new Changed Entity Export Job


        Use this endpoint to request a new Changed Entity Export Job for a specified `resourceType` with properties provided in the request body. The generated dataset will be one or multiple files that include all records which have changed between `dateChangedFrom` (specified by the user) and `dateChangedTo` (generated by the server at execution). Optionally, the user may also specify that inactive records be included in the export file with the `includeInactive` property. `ChangeTypes` began being stored in September 2020. Records for which the last change occurred before this date may be missing inaccurate `ChangeTypes` until they are updated. The user may also specify additional IDs with the `requestedIds` property to add to the dataset. The exported data will include all core fields for the resource type as well as any specified by the user with the `requestedFields` or `requestedCustomFieldIds` properties. If all generated content is less than the `fileSizeKbLimit`, then one file
        will be created. Otherwise, multiple files will be created such that none exceeds the specified limit.


        If the `dateChangedTo` parameter is in the past, the resulting records will be any which changed in the `dateChangedFrom` and `dateChangedTo` window. However, the records that will be returned by the job will *always be the current version of the records*. They will not be records at the snapshot moment in time of `dateChangedTo`.


        File download links expire after 20 days.'
      operationId: changedentityexportjobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dateChangedFrom:
                  type: string
                  description: '**Required**; timestamp in the format `YYYY-MM-DDThh:mm:ss.00Z` or `YYYY-MM-DDThh:mm:ss.00 -hh:mm`. Must be in the last 90 days.'
                  default: '2021-01-01T01:02:03+04:00'
                  format: date
                dateChangedTo:
                  type: string
                  description: '**Optional**; timestamp in the format `YYYY-MM-DDThh:mm:ss.00Z` or `YYYY-MM-DDThh:mm:ss.00 -hh:mm`. If provided, must be a date that is more recent than dateChangedFrom, and must be no later than the present. If not provided, will be set automatically to the time at which the API request is made.'
                  default: '2021-02-14T01:09:03+04:00'
                  format: date
                resourceType:
                  type: string
                  description: '**Required**; available resource type specified at the [/resources](https://docs.everyaction.com/reference/changed-entities#changedentityexportjobsresources) endpoint'
                  default: Contacts
                requestedIds:
                  type: array
                  description: IDs to be included in the exported set if available. Overrides the time window specified as well as the `includeInactive` property.
                  default:
                  - 1
                  - 23
                  - 456
                  - 7890
                  items:
                    type: integer
                    format: int32
                requestedFields:
                  type: array
                  description: Names of non-core fields to be included in the export
                  default:
                  - Prefix
                  - LastUpdatedOn
                  - DateCreated
                  items:
                    type: string
                requestedCustomFieldIds:
                  type: array
                  description: IDs of custom fields to be included in the export
                  default:
                  - 157
                  - 205
                  - 206
                  items:
                    type: integer
                    format: int32
                fileSizeKbLimit:
                  type: integer
                  description: The maximum size in Kb (between 1000 and 100000) of any exported `.csv` file; defaults to 40000
                  default: 40000
                  format: int32
                includeInactive:
                  type: boolean
                  description: If set to `true`, includes inactive records such as archived activist codes or deleted contacts. Defaults to `false`.
                  default: false
                contactMode:
                  type: integer
                  description: '**Optional**; Determines the type of contact records returned in the export. When this parameter is set to 1, only people contact records will be exported. When set to 2 only organization contact records will be exported. When it is omitted or set to 3 both people and organization contact records will be exported.'
                  format: int32
                requestedActivistCodeIds:
                  type: array
                  description: '**Optional**; A list of `ActivistCodeID` values to filter results returning only changed `ContactsActivistCodes` that match. This Param is available when `resourceType` is `"ContactsActivistCodes"`. For all other `resourceType` values it will be ignored when processing the job.'
                  items:
                    type: integer
                    format: int32
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"exportJobId\": 12345,\n  \"jobStatus\": \"Complete\",\n  \"dateChangedFrom\": \"2019-01-01T01:02:03+04:00\",\n  \"dateChangedTo\": \"2019-01-01T07:03:09+04:00\",\n  \"files\": [\n    {\n      \"downloadUrl\": \"https://www.example.com/some-unique-file-name.csv\",\n      \"dateExpired\": \"2019-01-31T15:05:54.2106809-04:00\"\n    }\n  ],\n  \"message\": \"Finished processing export job\",\n  \"code\": null,\n  \"exportedRecordCount\": 10500,\n  \"excludeChangesFromSelf\": \"true\"\n}"
              schema:
                type: object
                properties:
                  exportJobId:
                    type: integer
                    example: 12345
                    default: 0
                  jobStatus:
                    type: string
                    example: Complete
                  dateChangedFrom:
                    type: string
                    example: '2019-01-01T01:02:03+04:00'
                  dateChangedTo:
                    type: string
                    example: '2019-01-01T07:03:09+04:00'
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        downloadUrl:
                          type: string
                          example: https://www.example.com/some-unique-file-name.csv
                        dateExpired:
                          type: string
                          example: '2019-01-31T15:05:54.2106809-04:00'
                  message:
                    type: string
                    example: Finished processing export job
                  code: {}
                  exportedRecordCount:
                    type: integer
                    example: 10500
                    default: 0
                  excludeChangesFromSelf:
                    type: string
                    example: 'true'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
