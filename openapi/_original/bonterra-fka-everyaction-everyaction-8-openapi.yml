                  value: "{\n  \"items\": [\n    {\n      \"vanId\": 987654,\n      \"...\": null,\n      \"addresses\": [],\n      \"phones\": [],\n      \"districts\": [],\n      \"emails\": []\n    },\n    {\n      \"vanId\": 1234556,\n      \"...\": null,\n      \"addresses\": [],\n      \"phones\": [],\n      \"districts\": [],\n      \"emails\": []\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 2\n}\n    "
              schema:
