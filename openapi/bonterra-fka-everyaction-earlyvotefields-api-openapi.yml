- sec0: []
tags:
- name: EarlyVoteFields
paths:
  /earlyVoteFields:
    get:
      summary: /earlyVoteFields
      description: ''
      operationId: earlyvotefields
      parameters:
      - name: statuses
        in: query
        description: Comma-delimited list of *statuses* of Activist Codes. One or more of `Active` (default) and `Inactive`.
        schema:
          type: string
          default: Active,Inactive
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"items\": [\n        {\n            \"earlyVoteFieldId\": 1,\n            \"name\": \"Ballot Application Requested\",\n            \"type\": \"Date\",\n            \"status\": \"Active\",\n            \"values\": null\n        },\n        {\n            \"earlyVoteFieldId\": 2,\n            \"name\": \"Ballot Application Request Method\",\n            \"type\": \"Dropdown\",\n            \"status\": \"Active\",\n            \"values\": [\n                {\n                    \"id\": \"4\",\n                    \"label\": \"Mailed\"\n                },\n                {\n                    \"id\": \"5\",\n                    \"label\": \"One Stop\"\n                },\n                {\n                    \"id\": \"45\",\n                    \"label\": \"Request By Relative\"\n                }\n            ]\n        }\n    ],\n    \"nextPageLink\": \"https://api.securevan.com/v4/earlyVoteFields?statuses=Active&$top=2&$skip=2\",\n    \"count\": 23\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        earlyVoteFieldId:
                          type: integer
                          example: 1
                          default: 0
                        name:
                          type: string
                          example: Ballot Application Requested
                        type:
                          type: string
                          example: Date
                        status:
                          type: string
                          example: Active
                        values: {}
                  nextPageLink:
                    type: string
                    example: https://api.securevan.com/v4/earlyVoteFields?statuses=Active&$top=2&$skip=2
                  count:
                    type: integer
                    example: 23
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - EarlyVoteFields
  /earlyVoteFields/{earlyVoteFieldId}:
    get:
      summary: /earlyVoteFields/{earlyVoteFieldId}
      description: ''
      operationId: earlyvotefieldsearlyvotefieldid
      parameters:
      - name: earlyVoteFieldId
        in: path
        schema:
          type: integer
          format: int32
          default: 1
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"earlyVoteFieldId\": 1,\n    \"name\": \"Ballot Application Requested\",\n    \"type\": \"Date\",\n    \"status\": \"Active\",\n    \"values\": null\n}"
              schema:
                type: object
                properties:
                  earlyVoteFieldId:
                    type: integer
                    example: 1
                    default: 0
                  name:
                    type: string
                    example: Ballot Application Requested
                  type:
                    type: string
                    example: Date
                  status:
                    type: string
                    example: Active
                  values: {}
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"NOT_FOUND\",\n            \"text\": \"The specified resource cannot be found.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - EarlyVoteFields
