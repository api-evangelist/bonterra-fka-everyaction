  /contributions/{alternateIdType}:{alternateId}:
    get:
      summary: /contributions/{alternateIdType}:{alternateId}
      description: 'Retrieve a Contribution record by an Alternate ID. For example `/contributions/onlineReferenceNumber:12345` would retrieve a contribution whose Online Reference Number is 12345.


        If the specified Contribution does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: contributions-alternateidtype-alternateid
      parameters:
      - name: alternateIdType
        in: path
        description: Required; a known contribution identifier type available in the current context. Currently only `onlineReferenceNumber` is supported.
        schema:
          type: string
          default: onlineReferenceNumber
        required: true
      - name: alternateId
        in: path
        description: Required; an alternate identifier, URL encoded
        schema:
          type: string
          default: '123'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"contributionId\": 23453,\n    \"contact\": {\n        \"vanId\": 10005165\n    },\n    \"designation\": {\n        \"designationId\": 18754,\n    },\n    \"dateReceived\": \"2013-12-25T12:23:00Z\",\n    \"amount\": \"12.34\",\n    \"coverCostsAmount\": \"2.34\",\n    \"status\": \"Settled\",\n    ...\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Contributions
  /contributions/{contributionId}:
    get:
      summary: /contributions/{contributionId}
      description: 'Retrieve a Contribution by `contributionId`


        If the specified Contribution does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: contributions-contributionid
      parameters:
      - name: contributionId
        in: path
        description: Unique contribution identifier available in the current context
        schema:
          type: integer
          format: int32
          default: 4482
        required: true
      - name: $expand
        in: query
        description: Valid `$expand` sections are are `disclosureFieldValues`, `externalIds`, `generalLedgerFund`, `costCenter`, and `jointFundraisingEntity`.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
