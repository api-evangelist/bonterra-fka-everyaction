openapi: 3.2.0
info:
  title: everyaction-8 Contributions API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: Contributions
paths:
  /contributions:
    post:
      summary: /contributions
      description: Use this endpoint to create a new contribution with the properties provided in the request body. If successful, the endpoint responds with HTTP Status Code `201 Created` and the integer ID of the created Contribution in the response body. If any of the specified ids (`vanId`, `pledgeId`, `codeId`, or `extendedSourceCodeId`) are not accessible in the current context (e.g., the associated api user does not have access to the contact), the request will be considered invalid.
      operationId: post-contributions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              - designation
              - dateReceived
              - amount
              - status
              - paymentType
              properties:
                contact:
                  type: object
                  description: The [Person](https://docs.everyaction.com/reference/people) who contributed
                  properties:
                    vanId:
                      type: string
                      default: '10005165'
                designation:
                  type: object
                  description: The [Designation](https://docs.everyaction.com/reference/designations) which will receive funds associated with this Contribution.
                  properties:
                    designationId:
                      type: integer
                      default: 18754
                      format: int32
                dateReceived:
                  type: string
                  description: The date and time of this contribution; must occur before the time of the API call.
                  default: '2013-12-25T12:23:00Z'
                  format: date-time
                amount:
                  type: number
                  description: The amount of the contribution. Must be between $0.01 and $999,999.99 inclusive, unless disclosure fields are enabled, in which case all positive or negative values are allowed. May not have more than 2 digits after the decimal point.
                  default: 12.34
                  format: double
                status:
                  type: string
                  description: The current status of the contribution
                  default: Pending
                  enum:
                  - Pending
                  - Declined
                  - Settled
                  - Deposited
                  - InKind
                paymentType:
                  type: string
                  description: A string representing the method of payment.
                  default: MoneyOrder
                  enum:
                  - Check
                  - MoneyOrder
                  - Cash
                  - CreditCard
                  - InKind
                  - Unknown
                  - ElectronicFundsTransfer
                  - ElectronicPaySystem
                  - Stock
                  - ApplyPay
                  - PaycheckDeduction
                  - WireTransfer
                codes:
                  type: array
                  description: An array of zero or one [Codes](https://docs.everyaction.com/reference/codes) to apply to the contribution. Contributions may not have more than one Code applied, and if a Code is applied, it must be a Source Code.
                  items:
                    properties:
                      codeId:
                        type: integer
                        default: 1002316
                        format: int32
                      codeName:
                        type: string
                        default: Labor
                    required:
                    - codeId
                    type: object
                generalLedgerFund:
                  type: object
                  description: The associated GeneralLedgerFund object.
                  properties:
                    GeneralLedgerFundId:
                      type: integer
                      description: ID of the General Ledger Fund
                      default: 89
                      format: int32
                costCenter:
                  type: object
                  description: The associated CostCenter object.
                  properties:
                    costCenterId:
                      type: integer
                      description: ID of the Cost Center
                      default: 71
                      format: int32
                directMarketingCode:
                  type: string
                  description: The direct marketing code.
                  default: Excelsior Consulting
                notes:
                  type: string
                  description: A note describing the Contribution.
                  default: Donate
                extendedSourceCode:
                  type: object
                  description: The [Extended Source Code](https://docs.everyaction.com/reference/extended-source-codes) object to apply to the Contribution. Only the extendedSoureCodeId property is required. If this is provided and no `codes` are provided, we’ll look for and apply a matching Source Code to the contribution from a Direct Response Plan segment that the contact is in with a contact history record that has the extended source code. If no matching source code is found, then the POST will fail.
                  properties:
                    extendedSourceCodeId:
                      type: integer
                      description: A unique identifier for an Extended Source Code in this context
                      default: 123
                      format: int32
                financialBatchId:
                  type: integer
                  description: The ID of the associated [Financial Batch](https://docs.everyaction.com/reference/financial-batches). Required if Financial Batch Manager is enabled in the committee context; not allowed if Financial Batch Manager is disabled in the committee context. If specified, the Designation of the Financial Batch must match the Designation of the contribution.
                  default: 825
                  format: int32
                pledge:
                  type: object
                  description: The pledge associated with this contribution
                  properties:
                    pledgeId:
                      type: integer
                      default: 1
                      format: int32
                customFieldValues:
                  type: array
                  description: An array of 1 or more custom fields
                  items:
                    properties:
                      customFieldId:
                        type: integer
                        format: int32
                        default: '123'
                        description: The ID of the custom field
                      customFieldGroupId:
                        type: integer
                        description: The group ID of the custom field.
                        default: '123'
                        format: int32
                      assignedValue:
                        type: string
                        description: The value to be assigned to the custom field. If populating a checkbox, set value to 0 or 1. If populating a dropdown, set value to ID of selection.
                        default: test
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '1232123'
              schema:
                type: integer
                example: 1232123
                default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"INVALID_PARAMETER\",\n            \"text\": \"'designation' (designationId: 0) must be a valid Designation available in this context\",\n            \"properties\": [\n                \"designation\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: INVALID_PARAMETER
                        text:
                          type: string
                          example: '''designation'' (designationId: 0) must be a valid Designation available in this context'
                        properties:
                          type: array
                          items:
                            type: string
                            example: designation
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"UNAUTHORIZED\",\n            \"text\": \"The request could not be authorized because a session is not present, an Authentication header was not sent, and/or the route does not allow anonymous requests.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: UNAUTHORIZED
                        text:
                          type: string
                          example: The request could not be authorized because a session is not present, an Authentication header was not sent, and/or the route does not allow anonymous requests.
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"FORBIDDEN\",\n            \"text\": \"Your user does not have permission to use this endpoint.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: FORBIDDEN
                        text:
                          type: string
                          example: Your user does not have permission to use this endpoint.
        '500':
          description: '500'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"INTERNAL_SERVER_ERROR\",\n            \"text\": \"An unknown error occurred\",\n            \"referenceCode\": \"A1B2C3-D4E5F6\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: INTERNAL_SERVER_ERROR
                        text:
                          type: string
                          example: An unknown error occurred
                        referenceCode:
                          type: string
                          example: A1B2C3-D4E5F6
      deprecated: false
      tags:
      - Contributions
  /contributions/attributionTypes:
    get:
      summary: /contributions/attributionTypes
      description: Retreive a list of Attribution Types which are enabled on a Designation in the current committee.
      operationId: contributions-attribution-types
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n        {\n          \"vanId\": 303,\n          \"amountAttributed\": \"100.50\",\n          \"attributionType\": \"DefaultAttribution\",\n          \"notes\": \"some notes go here\",\n          \"dateThanked\": \"2013-12-30\"\n        },\n        {\n          \"vanId\": 701,\n          \"amountAttributed\": \"202.10\",\n          \"attributionType\": \"CorporateMatch\",\n          \"notes\": \"some notes go here\",\n          \"dateThanked\": \"2013-12-30\"\n        }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    vanId:
                      type: integer
                      example: 303
                      default: 0
                    amountAttributed:
                      type: string
                      example: '100.50'
                    attributionType:
                      type: string
                      example: DefaultAttribution
                    notes:
                      type: string
                      example: some notes go here
                    dateThanked:
                      type: string
                      example: '2013-12-30'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Contributions
  /contributions/payments:
    post:
      summary: /contributions/payments
      description: Records and processes a Contribution with the payment information provided in the request body.
      operationId: contributions-payments
      parameters:
      - name: Idempotency-Key
        in: header
        description: An unique value generated by the client which the server uses to recognize subsequent retries of the same request. Can be any string at most 50 characters long - we recommend a V4 UUID. Keys are temporary and may be removed from the system after 48 hours.
        required: true
        schema:
          type: string
          default: 00000000-0000-0000-0000-000000000123
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              - designation
              - gatewayId
              - amount
              - paymentMethod
              properties:
                contact:
                  type: object
                  description: The [Person](https://docs.everyaction.com/reference/people) who contributed.
                  properties:
                    vanId:
                      type: string
                      default: '10005165'
                designation:
                  type: object
                  description: The [Designation](https://docs.everyaction.com/reference/designations) which will receive funds associated with this Contribution.
                  properties:
                    designationId:
                      type: integer
                      default: 18754
                      format: int32
                gatewayId:
                  type: integer
                  description: The payment gateway which will process this Contribution.
                  default: 123456
                  format: int32
                amount:
                  type: number
                  description: Monetary amount of the Contribution. Non-positive values, and values that have more than 2 digits after the decimal point, will not be accepted. Must be between $0.01 and $999,999.99, inclusive.
                  default: 12.34
                  format: double
                paymentMethod:
                  type: object
                  description: Payment information that will be used to process the Contribution.
                  properties:
                    paymentType:
                      type: string
                      description: The value of PaymentType determines the required parameters for the rest of this object. CreditCard requires creditCardNumber, expirationMonth, expirationYear, with cvv optional; ElectronicFundsTransfer requires accountType, routingNumber, accountNumber. Including CreditCard fields with paymentType EFT or vice versa will be treated as an invalid request.
                      default: CreditCard
                      enum:
                      - CreditCard
                      - ElectronicFundsTransfer
                    creditCardNumber:
                      type: string
                      description: Credit card payments - credit card number
                      default: '411111111111111'
                    cvv:
                      type: string
                      description: Credit card payments - credit card cvv
                      default: '123'
                    expirationMonth:
                      type: string
                      description: Credit card payments - two-digit expiration month of card
                      default: '05'
                    expirationYear:
                      type: string
                      description: Credit card payments - four-digit expiration year
                      default: '2026'
                    accountType:
                      type: string
                      description: ElectronicFundsTransfer payments - the type of account
                      enum:
                      - PersonalChecking
                      - PersonalSavings
                    accountNumber:
                      type: string
                      description: ElectronicFundsTransfer payments - account number
                      default: '11718223245378973'
                    routingNumber:
                      type: string
                      description: ElectronicFundsTransfer payments - routing number
                      default: '11123224375893663'
                codes:
                  type: array
                  description: An array of zero or one [Codes](https://docs.everyaction.com/reference/codes) to apply to the contribution. Contributions may not have more than one Code applied, and if a Code is applied, it must be a Source Code.
                  items:
                    properties:
                      codeId:
                        type: integer
                        default: 1002316
                        format: int32
                      codeName:
                        type: string
                        default: Labor
                    required:
                    - codeId
                    type: object
                generalLedgerFund:
                  type: object
                  description: The associated GeneralLedgerFund object.
                  properties:
                    GeneralLedgerFundId:
                      type: integer
                      description: ID of the General Ledger Fund
                      default: 89
                      format: int32
                costCenter:
                  type: object
                  description: The associated CostCenter object.
                  properties:
                    costCenterId:
                      type: integer
                      description: ID of the Cost Center
                      default: 71
                      format: int32
                directMarketingCode:
                  type: string
                  description: The direct marketing code.
                  default: Excelsior Consulting
                notes:
                  type: string
                  description: A note describing the Contribution.
                  default: Donated in-person at Annual Gala
                extendedSourceCode:
                  type: object
                  description: The [Extended Source Code](https://docs.everyaction.com/reference/extended-source-codes) object to apply to the Contribution. Only the extendedSoureCodeId property is required. If this is provided and no `codes` are provided, we’ll look for and apply a matching Source Code to the contribution from a Direct Response Plan segment that the contact is in with a contact history record that has the extended source code. If no matching source code is found, then the POST will fail.
                  properties:
                    extendedSourceCodeId:
                      type: integer
                      description: A unique identifier for an Extended Source Code in this context
                      default: 123
                      format: int32
                financialBatchId:
                  type: integer
                  description: The ID of the associated [Financial Batch](https://docs.everyaction.com/reference/financial-batches). Required if Financial Batch Manager is enabled in the committee context; not allowed if Financial Batch Manager is disabled in the committee context. If specified, the Designation of the Financial Batch must match the Designation of the contribution.
                  default: 825
                  format: int32
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '12345'
              schema:
                type: integer
                example: 12345
                default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"INVALID_PARAMETER\",\n            \"text\": \"'designation' (designationId: 0) must be a valid Designation available in this context\",\n            \"properties\": [\n                \"designation\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: INVALID_PARAMETER
                        text:
                          type: string
                          example: '''designation'' (designationId: 0) must be a valid Designation available in this context'
                        properties:
                          type: array
                          items:
                            type: string
                            example: designation
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"UNAUTHORIZED\",\n            \"text\": \"The request could not be authorized because a session is not present, an Authentication header was not sent, and/or the route does not allow anonymous requests.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: UNAUTHORIZED
                        text:
                          type: string
                          example: The request could not be authorized because a session is not present, an Authentication header was not sent, and/or the route does not allow anonymous requests.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"FORBIDDEN\",\n            \"text\": \"Your user does not have permission to use this endpoint.\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: FORBIDDEN
                        text:
                          type: string
                          example: Your user does not have permission to use this endpoint.
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"CONFLICT\",\n            \"text\": \"Duplicate in-progress transaction detected\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: CONFLICT
                        text:
                          type: string
                          example: Duplicate in-progress transaction detected
        '500':
          description: '500'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"INTERNAL_SERVER_ERROR\",\n            \"text\": \"An unknown error occurred\",\n            \"referenceCode\": \"A1B2C3-D4E5F6\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: INTERNAL_SERVER_ERROR
                        text:
                          type: string
                          example: An unknown error occurred
                        referenceCode:
                          type: string
                          example: A1B2C3-D4E5F6
      deprecated: false
      tags:
      - Contributions
