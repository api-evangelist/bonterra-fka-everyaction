openapi: 3.2.0
info:
  title: everyaction-8 Events API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: Events
paths:
  /events:
    post:
      summary: /events
      description: 'Use this endpoint to create a new Event.


        If successful, the endpoint responds with HTTP Status Code `201 Created` and the integer ID of the created Event in the response body. It also sets the **Location** header to the location of the newly created Event.'
      operationId: post-events
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: object
                  description: Accepts a standard Event object with simple types and no read-only values specified.
                  properties: {}
            examples:
              Request Example:
                value:
                  name: Neighbors Calling Neighbors
                  shortName: NeighborCall
                  description: Come help get the word out about our great campaign.
                  startDate: '2015-06-02T15:00:00-04:00'
                  endDate: '2015-06-02T20:00:00-04:00'
                  eventType:
                    eventTypeId: 143856
                  isOnlyEditableByCreatingUser: false
                  locations:
                  - locationId: 273
                  codes:
                  - codeId: 20516
                  - codeId: 20518
                  notes:
                  - text: Lorem ipsum dolor sit amet, consectetur adipiscing elit...
                    isViewRestricted: true
                  shifts:
                  - name: Setup
                    startTime: '2015-06-01T15:00:00-04:00'
                    endTime: '2015-06-01T16:00:00-04:00'
                  - name: Early Shift
                    startTime: '2015-06-01T16:00:00-04:00'
                    endTime: '2015-06-01T18:00:00-04:00'
                  - name: Late Shift
                    startTime: '2015-06-01T18:00:00-04:00'
                    endTime: '2015-06-01T20:00:00-04:00'
                  roles:
                  - roleId: 111687
                    name: Host
                    isEventLead: true
                  - roleId: 111689
                    name: Phone Banker
                    isEventLead: false
                    min: 5
                    goal: 20
                  voterRegistrationBatches:
                  - voterRegistrationBatchId: 999
                  - voterRegistrationBatchId: 1000
                  districtFieldValue: '003'
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '123456789'
              schema:
                type: integer
                example: 123456789
                default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Events
    get:
      summary: /events
      description: 'Find Events


        *Description*


        Use this endpoint to find Events available in the current context using a number of filter options.


        *Request*


        This endpoint accepts standard pagination parameters and returns a standard paginated response.


        By default, this endpoint returns 10 records per request. A maximum of 50 records per request is allowed via the `$top` parameter.


        Valid expansion properties are: `locations`, `codes`, `shifts`, `roles`, `notes`. Note that the number of `$expand` sections requested may impact the speed with which this endpoint will respond.


        The endpoint takes the optional filter parameters as described below'
      operationId: get-events
      parameters:
      - name: codeIds
        in: query
        description: Filters Events to those with the given Code(s) applied (multiple `codeIds` should be comma-delimited)
        schema:
          type: string
          default: 20513,20515
      - name: eventTypeIds
        in: query
        description: Filters Events to those of the given Event Type(s) (multiple `eventTypeIds` should be comma-delimited)
        schema:
          type: string
          default: 20036,81987
      - name: inRepetitionWithEventId
        in: query
        description: Filters to Recurring Events that are recurrences of the given Event ID
        schema:
          type: integer
          format: int32
          default: 1374
      - name: startingAfter
        in: query
        description: Filters Events to those starting after (and not including) a given date (in the format `yyyy-MM-dd`)
        schema:
          type: string
          format: date
          default: '2019-06-23'
      - name: startingBefore
        in: query
        description: Filters Events to those starting before (and not including) a given date (in the format `yyyy-MM-dd`)
        schema:
          type: string
          format: date
          default: '2019-06-26'
      - name: districtFieldValue
        in: query
        description: Filters Events to those which are associated with the specified District Field Value
        schema:
          type: string
          default: '003'
      - name: createdByCommitteeId
        in: query
        description: Filters Events to those which were created by the specified CommitteeID
        schema:
          type: integer
          format: int32
          default: 123
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of [expansion](https://everyaction.readme.io/reference#expansion) properties: `locations`, `codes`, `shifts`, `roles`, `notes`'
        schema:
          type: string
          default: locations,codes
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"eventId\": 1370,\n      \"name\": \"Neighbors Calling Neighbors\",\n      \"shortName\": \"NeighborCall\",\n      \"description\": \"Come help get the word out about our great campaign.\",\n      \"startDate\": \"2015-06-01T15:00:00-04:00\",\n      \"endDate\": \"2015-06-01T20:00:00-04:00\",\n      \"eventType\": {\n        \"eventTypeId\": 143856,\n        \"name\": \"Phone Bank\"\n      },\n      \"isOnlyEditableByCreatingUser\": false,\n      \"isPubliclyViewable\": null,\n      \"locations\": null,\n      \"codes\": null,\n      \"notes\": null,\n      \"shifts\": [\n        {\n          \"eventShiftId\": 2162,\n          \"name\": \"Setup\",\n          \"startTime\": \"2015-06-01T15:00:00-04:00\",\n          \"endTime\": \"2015-06-01T16:00:00-04:00\"\n        }\n      ],\n      \"roles\": null,\n      \"districtFieldValue\": \"003\",\n      \"voterRegistrationBatches\": null,\n      \"createdDate\": \"2015-04-05T13:18:00Z\"\n    }\n  ],\n  \"nextPageLink\": \"https://api.securevan.com:443/v4/events?startingAfter=2015-05-31&$expand=shifts&$top=2&$skip=2\",\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId:
                          type: integer
                          example: 1370
                          default: 0
                        name:
                          type: string
                          example: Neighbors Calling Neighbors
                        shortName:
                          type: string
                          example: NeighborCall
                        description:
                          type: string
                          example: Come help get the word out about our great campaign.
                        startDate:
                          type: string
                          example: '2015-06-01T15:00:00-04:00'
                        endDate:
                          type: string
                          example: '2015-06-01T20:00:00-04:00'
                        eventType:
                          type: object
                          properties:
                            eventTypeId:
                              type: integer
                              example: 143856
                              default: 0
                            name:
                              type: string
                              example: Phone Bank
                        isOnlyEditableByCreatingUser:
                          type: boolean
                          example: false
                          default: true
                        isPubliclyViewable: {}
                        locations: {}
                        codes: {}
                        notes: {}
                        shifts:
                          type: array
                          items:
                            type: object
                            properties:
                              eventShiftId:
                                type: integer
                                example: 2162
                                default: 0
                              name:
                                type: string
                                example: Setup
                              startTime:
                                type: string
                                example: '2015-06-01T15:00:00-04:00'
                              endTime:
                                type: string
                                example: '2015-06-01T16:00:00-04:00'
                        roles: {}
                        districtFieldValue:
                          type: string
                          example: '003'
                        voterRegistrationBatches: {}
                        createdDate:
                          type: string
                          example: '2015-04-05T13:18:00Z'
                  nextPageLink:
                    type: string
                    example: https://api.securevan.com:443/v4/events?startingAfter=2015-05-31&$expand=shifts&$top=2&$skip=2
                  count:
                    type: integer
                    example: 1
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Events
  /events/types:
    get:
      summary: /events/types
      description: Use this endpoint to retrieve all Event Types that are available in the current context.
      operationId: events-types
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"eventTypeId\":20036\n    \"name\":\"Canvassing\"\n    \"canHaveMultipleShifts\":true\n    \"canHaveMultipleLocations\":false\n    \"canHaveGoals\":false\n    \"canHaveRoleMaximums\":false\n    \"canHaveRoleMinimums\":false\n    \"canBeRepeatable\":true\n    \"roles\":[...]\n    \"statuses\":[...]\n    \"color\":\"#789CD2\"\n    \"isAtLeastOneLocationRequired\":false\n    \"defaultLocation\":NULL\n    \"isSharedWithMasterCommitteeByDefault\":false\n    \"isSharedWithChildCommitteesByDefault\":false\n    \"isOnlineActionsAvailable\":false\n  }\n]"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
      deprecated: false
      tags:
      - Events
  /events/types/{eventTypeId}:
    get:
      summary: /events/types/{eventTypeId}
      description: Use this endpoint to retrieve information about a specific Event Type available in the current context.
      operationId: events-types-eventtypeid
      parameters:
      - name: eventTypeId
        in: path
        description: Unique identifier for a specific Event Type
        schema:
          type: integer
          format: int32
          default: 20036
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"eventTypeId\":20036\n  \"name\":\"Canvassing\"\n  \"canHaveMultipleShifts\":true\n  \"canHaveMultipleLocations\":false\n  \"canHaveGoals\":false\n  \"canHaveRoleMaximums\":false\n  \"canHaveRoleMinimums\":false\n  \"canBeRepeatable\":true\n  \"roles\":[...]\n  \"statuses\":[...]\n  \"color\":\"#789CD2\"\n  \"isAtLeastOneLocationRequired\":false\n  \"defaultLocation\":NULL\n  \"isSharedWithMasterCommitteeByDefault\":false\n  \"isSharedWithChildCommitteesByDefault\":false\n  \"isOnlineActionsAvailable\":false\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Events
  /events/{eventId}:
    get:
      summary: /events/{eventId}
      description: 'Use this endpoint to retrieve the details of a specific Event.


        Use the Signups endpoint to retrieve a list of the Event’s participants.'
      operationId: events-eventid
      parameters:
      - name: eventId
        in: path
        description: Required; Unique identifier of an Event to be retrieved
        schema:
          type: integer
          format: int32
          default: 1631
        required: true
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of [expansion](https://everyaction.readme.io/reference#expansion) properties: `locations`, `codes`, `shifts`, `roles`, `notes`, `voterRegistrationBatches`'
        schema:
          type: string
          default: locations,codes
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"eventId\":1631\n  \"name\":\"OSDI Phonebank\"\n  \"shortName\":\"osdipb\"\n  \"description\":\"a test phone bank\"\n  \"startDate\":\"2016-03-23T13:00:00-04:00\"\n  \"endDate\":\"2016-03-23T18:00:00-04:00\"\n  \"eventType\":{...}\n  \"isOnlyEditableByCreatingUser\":false\n  \"isPubliclyViewable\":NULL\n  \"locations\":[\n    {\n      \"locationId\":302\n      \"name\":\"Satellite\"\n      \"displayName\":\"Satellite, 2200 Minnesota Ave SE Washington, DC 20020 \"\n      \"address\":{...}\n      \"id\":302\n      \"notes\":NULL\n      \"codes\":NULL\n    }\n  ]\n  \"codes\":[\n    {\n      \"codeId\":25687\n      \"parentCodeId\":NULL\n      \"name\":\"osdi_code\"\n      \"description\":NULL\n      \"codePath\":\"osdi_code\"\n      \"createdByName\":\"\"\n      \"dateCreated\":\"2016-03-10T00:46:00Z\"\n      \"supportedEntities\":NULL\n      \"codeType\":\"Tag\"\n      \"campaign\":NULL\n      \"contactType\":NULL\n      \"dateModified\":NULL\n      \"revenueStreamId\":NULL\n    }\n  ]\n  \"notes\":NULL\n  \"shifts\":NULL\n  \"roles\":NULL\n  \"ticketCategories\":NULL\n  \"voterRegistrationBatches\":NULL\n  \"createdDate\":\"2016-02-28T19:15:00Z\"\n  \"districtFieldValue\":NULL\n  \"financialProgram\":NULL\n  \"isActive\":true\n  \"dotNetTimeZoneId\":NULL\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n      \"code\":\"NOT_FOUND\"\n      \"text\":\"The specified resource cannot be found.\"\n    }\n  ]\n}"
      deprecated: false
      tags:
      - Events
    patch:
      summary: /events/{eventId}
      description: 'Changes the status of an Event. Note: only the `status` property may be patched.


        If the specified Event does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If `isActive` is `true` but specified Event is not editable, this endpoint will return an error with HTTP Status Code `403 Forbidden`.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` and an empty response body.'
      operationId: patch-events-eventid
      parameters:
      - name: eventId
        in: path
        description: Required; Unique identifier of the Event to be updated
        schema:
          type: integer
          format: int32
          default: 1631
        required: true
      - name: recurrenceType
        in: path
        description: Optional; the Events in a recurring series to update. Must be one of `ThisEvent`, `ThisAndFutureEvents`, or `AllEvents`. Default, if not supplied, is `ThisEvent`.
        schema:
          type: string
          default: AllEvents
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: integer
                  description: Required; Unique identifier of the event to be updated
                  default: 1631
                  format: int32
                isActive:
                  type: boolean
                  description: Required; If `true`, will restore a previously deleted Event; If `false`, the result will effectively be the same as if the Events Delete API method had been called.
                  default: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n      \"code\":\"FORBIDDEN\"\n      \"text\":\"Access to this resource is restricted.\"\n    }\n  ]\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Events
    put:
      summary: /events/{eventId}
      description: 'Use this endpoint to update the editable properties of an existing Event. When constructing your request, note that all properties must be specified otherwise it is assumed they should be removed or set to null. In other words, if the `locations` property is set to `null` or `[]` (an empty array) in the request, all Locations are removed from the Event. If removing all Locations violates the rules of the Event’s Event Type, a validation error will be returned.


        Similarly, when constructing your request, collection properties should include all of the existing elements you wish to retain. For example, if you intend to add an additional Role to an event, you’ll need to pass the existing roles and the new Role. If you don’t, the new Role will be added and the existing Roles will be removed.


        If you only intend to add Shifts to an existing Event, consider using the Shift creation endpoint.


        The validation rules for updating an Event are the same as the rules for creating an Event except that the *read-only* unique identifier properties such as `eventId` must also be sent.


        Note that while it is possible to modify the `startTime` and `endTime` of an existing Shift, modification will not change the `startTime` or `endTime` of previously scheduled Signups to the Event.


        The following example modifies the Event created in the `POST /events` example by:


        * Changing the `name` and `shortName`

        * Changing the `locations` (removing `locationId` *273* and adding `locationId` *272*)

        * Removing all `codes`

        vRemoving the *Setup* shift and extending the hours of the *Early Shift*

        * Changing the `voterRegistrationBatches` (removing the link to *999* and adding a link to *1001*)


        If the specified Event does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If the specified Event does exist but is not editable, this endpoint will return an error with HTTP Status Code `403 Forbidden`.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` and an empty response body.'
      operationId: put-events-eventid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: object
                  description: Accepts a standard [Event](https://everyaction.readme.io/reference#event) object
                  properties: {}
            examples:
              Request Example:
                value:
                  eventId: 1374
                  name: Friends Calling Friends
                  shortName: FriendCall
                  description: Come help get the word out about our great campaign.
                  startDate: '2015-06-02T15:00:00-04:00'
                  endDate: '2015-06-02T20:00:00-04:00'
                  eventType:
                    eventTypeId: 143856
                  isOnlyEditableByCreatingUser: false
                  locations:
                  - locationId: 272
                  codes: []
                  notes:
                  - noteId: 10
                    text: Sed ut perspiciatis unde omnis iste natus...
                    isViewRestricted: true
                  - text: Lorem ipsum dolor sit amet, consectetur adipiscing elit...
                  shifts:
                  - eventShiftId: 2175
                    name: Early Shift
                    startTime: '2015-06-01T15:00:00-04:00'
                    endTime: '2015-06-01T18:00:00-04:00'
                  - eventShiftId: 2176
                    name: Late Shift
                    startTime: '2015-06-01T18:00:00-04:00'
                    endTime: '2015-06-01T20:00:00-04:00'
                  roles:
                  - roleId: 111687
                    name: Host
                    isEventLead: true
                    min: null
                    max: null
                    goal: null
                  - roleId: 111689
                    name: Phone Banker
                    isEventLead: false
                    min: 5
                    max: null
                    goal: 20
                  voterRegistrationBatches:
                  - voterRegistrationBatchId: 1000
                  - voterRegistrationBatchId: 1001
                  districtFieldValue: '004'
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n      \"code\":\"FORBIDDEN\"\n      \"text\":\"Access to this resource is restricted.\"\n    }\n  ]\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - Events
    delete:
      summary: /events/{eventId}
      description: 'Use this endpoint to delete an existing Event and its related Signups. If the Event is part of a recurring series of Events, the other Events in the series will remain untouched.


        If the Event is linked to any Voter Registration Batches, the links will be removed.


        If the specified Event does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found`.


        If the specified Event does exist but is not editable, this endpoint will return an error with HTTP Status Code `403 Forbidden`.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` and an empty response body.'
      operationId: delete-events-eventid
      parameters:
      - name: eventId
        in: path
        description: Required; Unique identifier for an editable Event
        schema:
          type: integer
          format: int32
          default: 1374
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '403':
          description: '403'
          content:
            application/json:
              examples:
