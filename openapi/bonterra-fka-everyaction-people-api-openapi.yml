  /people/{vanId}/codes:
    post:
      summary: /people/{vanId}/codes
      description: 'Use this endpoint to apply a single Code to a Person.


        If the specified Person does not exist, this endpoint will return an error with HTTP Status Code `404 Not Found.`


        If the specified Person does exist but the Code does not or cannot be applied to People, this endpoint will return an error with HTTP Status Code `400 Bad Request`.


        In some contexts it is possible to apply both Tags and Source Codes to People. In these contexts, any number of Tags and Source Codes may be accepted. However:


        * If any Source Codes are applied to a Person within 24 hours of the creation of a Person record, then the first such Source Code will be marked as the Origin Source Code for the Person. Otherwise, the Person will have no Origin Source Code.

        * If an Origin Source Code exists for a Person, it will be displayed in the user interface; otherwise, no Source Codes for a Person will be displayed in the user interface.

        * All Tags for a Person will be displayed in the user interface.


        If successful, the endpoint responds with HTTP Status Code `204 No Content` and an empty response body.'
      operationId: people-vanid-codes
      parameters:
      - name: vanId
        in: path
        description: Unique person identifier available in the current context
        schema:
          type: string
          default: '100476252'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codeId:
                  type: string
                  description: Required; Unique identifier for an existing [Code](https://docs.everyaction.com/reference/codes) that is applicable to a Person.
                  default: '20545'
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\",\n            \"properties\": [\n                \"propertyName\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
                        properties:
                          type: array
                          items:
                            type: string
                            example: propertyName
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - People
