      description: 'Retrieve a person record and associated contact information.


        Note the following with regards to `expand` parameter values:

        * The `addresses` value will provide best known Home and Mailing address, if available.

        * The `recordedAddresses` value will provide all available address history, but requires special permissions.

        * The `preferences` value is required to retrieve the following properties: `nickname`, `website`, `contactMethodPreferenceCode`, and `jobTitle`.


        If no Person with the indicated `vanId` is available, this endpoint will return an error with HTTP Status Code `404 Not Found`.'
      operationId: get-people-vanid
      parameters:
      - name: vanId
        in: path
        description: Unique person identifier available in the current context
        schema:
          type: string
          default: '100476252'
        required: true
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of expansion properties: `phones`, `emails`, `addresses`, `customFields`, `externalIds`, `recordedAddresses`, `preferences`, `suppressions`, `reportedDemographics`, `disclosureFieldValues`'
        schema:
          type: string
          default: phones,emails
