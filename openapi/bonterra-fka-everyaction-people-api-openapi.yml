openapi: 3.2.0
info:
  title: everyaction-8 People API
  version: '1.0'
servers:
- url: https://api.securevan.com/v4
security:
- sec0: []
tags:
- name: People
paths:
  /people:
    get:
      summary: /people
      description: 'Returns a paginated list of contacts who meet all of the specified criteria.


        Unless noted otherwise, search criteria can be partial inputs; they will match any string that starts with the value provided (case-insensitive).


        At least one string parameter must be specified.'
      operationId: get-people
      parameters:
      - name: firstName
        in: query
        schema:
          type: string
      - name: middleName
        in: query
        schema:
          type: string
      - name: lastName
        in: query
        schema:
          type: string
      - name: streetAddress
        in: query
        schema:
          type: string
      - name: city
        in: query
        schema:
          type: string
      - name: stateOrProvince
        in: query
        description: Must be a valid state or province code (two or three characters)
        schema:
          type: string
      - name: zipOrPostalCode
        in: query
        description: Must be a valid ZIP5 zip code or postal code. For UK clients, this parameter accepts valid partial postcodes (e.g., postcode sector).
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Must be a valid phone number
        schema:
          type: string
      - name: email
        in: query
        schema:
          type: string
      - name: commonName
        in: query
        description: If Organizations-as-Contacts is enabled in your database, matches organizations whose Common Name begins with this value.
        schema:
          type: string
      - name: officialName
        in: query
        description: If Organizations-as-Contacts is enabled in your database, matches organizations whose Official Name begins with this value.
        schema:
          type: string
      - name: contactMode
        in: query
        description: If Organizations-as-Contacts is enabled in your database, filters to records of this type.
        schema:
          type: string
          enum:
          - Person
          - Organization
      - name: $top
        in: query
        schema:
          type: integer
          format: int32
      - name: $skip
        in: query
        schema:
          type: integer
          format: int32
      - name: $expand
        in: query
        description: Valid `$expand` sections are are `Addresses`, `Districts`, `Emails`, and `Phones`.
        schema:
          type: string
      - name: $orderby
        in: query
        description: '`Name asc` and `Name desc` are the only valid `$orderby` arguments'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"vanId\": 987654,\n      \"...\": null,\n      \"addresses\": [],\n      \"phones\": [],\n      \"districts\": [],\n      \"emails\": []\n    },\n    {\n      \"vanId\": 1234556,\n      \"...\": null,\n      \"addresses\": [],\n      \"phones\": [],\n      \"districts\": [],\n      \"emails\": []\n    }\n  ],\n  \"nextPageLink\": null,\n  \"count\": 2\n}\n    "
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        vanId:
                          type: integer
                          example: 987654
                          default: 0
                        '...': {}
                        addresses:
                          type: array
                        phones:
                          type: array
                        districts:
                          type: array
                        emails:
                          type: array
                  nextPageLink: {}
                  count:
                    type: integer
                    example: 2
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Invalid phoneNumber:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"INVALID_PARAMETER\",\n      \"text\": \"'phoneNumber' (1507) is not a valid phone number for NorthAmerica\",\n      \"properties\": [\n        \"phoneNumber\"\n      ],\n      \"hint\": \"After non-numeric characters are removed, value must match the regular expression: ^1?[2-9][0-8]\\\\d[2-9]\\\\d{6,6}$\"\n    }\n  ]\n}"
                Not enough search parameters:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"INVALID_PARAMETER\",\n      \"text\": \"This endpoint requires at least one search parameter to be set.\",\n      \"properties\": [\n        \"All Arguments\"\n      ]\n    }\n  ]\n}"
              schema:
                oneOf:
                - title: Invalid phoneNumber
                  type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            example: INVALID_PARAMETER
                          text:
                            type: string
                            example: '''phoneNumber'' (1507) is not a valid phone number for NorthAmerica'
                          properties:
                            type: array
                            items:
                              type: string
                              example: phoneNumber
                          hint:
                            type: string
                            example: 'After non-numeric characters are removed, value must match the regular expression: ^1?[2-9][0-8]\d[2-9]\d{6,6}$'
                - title: Not enough search parameters
                  type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            example: INVALID_PARAMETER
                          text:
                            type: string
                            example: This endpoint requires at least one search parameter to be set.
                          properties:
                            type: array
                            items:
                              type: string
                              example: All Arguments
      deprecated: false
      tags:
      - People
  /people/find:
    post:
      summary: /people/find
      description: Attempts to find a person using the given match candidate. See Common Models for a full list of fields.
      operationId: people-find
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vanId:
                  type: string
                  description: Providing a valid VANID will override other search criteria
                firstName:
                  type: string
                  default: James
                middleName:
                  type: string
                lastName:
                  type: string
                  default: Gordon
                dateOfBirth:
                  type: string
                  format: date
                phones:
                  type: array
                  description: Contact records may have more than one associated phone number
                  items:
                    properties:
                      phoneNumber:
                        type: string
                        description: Number without numeric country code, integer input also accepted (without special characters)
                        default: 202-686-9330
                      dialingPrefix:
                        type: string
                        description: Optional; numeric country code
                        default: '1'
                      countryCode:
                        type: string
                        description: Optional; Apha-2 country code
                        default: US
                    type: object
                emails:
                  type: array
                  description: Contact records may have more than one associated email
                  items:
                    properties:
                      email:
                        type: string
                        default: j.gordon@sink.sendgrid.net
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"lastName\": \"Gordon\",\n    \"middleName\": \"Worthington\",\n    \"party\": \"D\",\n    \"employer\": \"Acme Medical Group\",\n    \"occupation\": \"Physician\",\n    \"sex\": \"M\",\n    \"dateOfBirth\": \"1976-07-04T00:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\",\n            \"properties\": [\n                \"identifiers[0].type\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
                        properties:
                          type: array
                          items:
                            type: string
                            example: identifiers[0].type
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - People
  /people/findByPhone:
    post:
      summary: /people/findByPhone
      description: 'Use this endpoint to get the record of an individual if there is exactly one match to the given phone number.


        If no matching phone number is found, an HTTP `404 Not Found` response is returned. This same response is also returned if more than one matching phone number is found. A successful response is only generated when the phone number is found on exactly one contact record.


        Successful requests will return an HTTP `200` response with a JSON body containing information on the matching record.'
      operationId: find-by-phone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  description: A valid phone number as an integer or string
                  default: '8005551212'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"lastName\": \"Gordon\",\n    \"middleName\": \"Worthington\",\n    \"party\": \"D\",\n    \"employer\": \"Acme Medical Group\",\n    \"occupation\": \"Physician\",\n    \"sex\": \"M\",\n    \"dateOfBirth\": \"1976-07-04T00:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\"            \n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\":[\n    {\n      \"code\":\"NOT_FOUND\"\n      \"text\":\"The specified resource cannot be found.\"\n    }\n  ]\n}"
      deprecated: false
      tags:
      - People
  /people/findOrCreate:
    post:
      summary: /people/findOrCreate
      description: 'Attempts to find the given match candidate. If a person is found, it is updated with the information provided. If a person is not found, a new person record is created.


        See Common Models for a full list of fields.'
      operationId: people-findorcreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vanId:
                  type: string
                  default: '100476252'
                firstName:
                  type: string
                  default: James
                lastName:
                  type: string
                  default: Gordon
                dateOfBirth:
                  type: string
                  format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"lastName\": \"Gordon\",\n    \"middleName\": \"Worthington\",\n    \"party\": \"D\",\n    \"employer\": \"Acme Medical Group\",\n    \"occupation\": \"Physician\",\n    \"sex\": \"M\",\n    \"dateOfBirth\": \"1976-07-04T00:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\",\n            \"properties\": [\n                \"emails[0].type\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
                        properties:
                          type: array
                          items:
                            type: string
                            example: emails[0].type
      deprecated: false
      tags:
      - People
  /people/{personIdType}:{personId}:
    post:
      summary: /people/{personIdType}:{personId}
      description: Updates a Person record. An alias for using POST /people/findOrCreate with an `identifiers` object that has a `type` property equal to the `personIdType` route parameter and an `externalId` property equal to the `personId` route parameter.
      operationId: people-persoid-type-personid
      parameters:
      - name: personIdType
        in: path
        description: Required; a known person identifier type available in the current context
        schema:
          type: string
          default: GWID
        required: true
      - name: personId
        in: path
        description: Required; an external identifier, URL encoded
        schema:
          type: string
          default: '3'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vanId:
                  type: string
                  default: '100476252'
                firstName:
                  type: string
                  default: James
                lastName:
                  type: string
                  default: Gordon
                dateOfBirth:
                  type: string
                  default: 1970-02-11T10:15:26Z7-04
                  format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"lastName\": \"Gordon\",\n    \"middleName\": \"Worthington\",\n    \"party\": \"D\",\n    \"employer\": \"Acme Medical Group\",\n    \"occupation\": \"Physician\",\n    \"sex\": \"M\",\n    \"dateOfBirth\": \"1976-07-04T00:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"code\": \"Error code\",\n            \"text\": \"Error description\",\n            \"properties\": [\n                \"addresses[0].type\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: Error code
                        text:
                          type: string
                          example: Error description
                        properties:
                          type: array
                          items:
                            type: string
                            example: addresses[0].type
      deprecated: false
      tags:
      - People
    get:
      summary: /people/{personIdType}:{personId}
      description: Retrieve a person record and associated contact information. For example `/people/DWID:12345` would retrieve a person whose DWID is 12345.
      operationId: get-people-personid-type-personid
      parameters:
      - name: personIdType
        in: path
        description: Required; a known person identifier type available in the current context
        schema:
          type: string
          default: GWID
        required: true
      - name: personId
        in: path
        description: Required; an external identifier, URL encoded
        schema:
          type: string
          default: '3'
        required: true
      - name: $expand
        in: query
        description: 'Optional; comma-delimited list of expansion properties: `phones`, `emails`, `addresses`, `customFields`'
        schema:
          type: string
          default: phones,emails
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"vanId\": 100476252,\n    \"firstName\": \"James\",\n    \"lastName\": \"Gordon\",\n    \"middleName\": \"Worthington\",\n    \"party\": \"D\",\n    \"employer\": \"Acme Medical Group\",\n    \"occupation\": \"Physician\",\n    \"sex\": \"M\",\n    \"dateOfBirth\": \"1976-07-04T00:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"FORBIDDEN\",\n      \"text\": \"Access to this resource is restricted.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: FORBIDDEN
                        text:
                          type: string
                          example: Access to this resource is restricted.
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"NOT_FOUND\",\n      \"text\": \"The specified resource cannot be found.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NOT_FOUND
                        text:
                          type: string
                          example: The specified resource cannot be found.
      deprecated: false
      tags:
      - People
  /people/{personIdType}:{personId}/canvassResponses:
    post:
      summary: /people/{personIdType}:{personId}/canvassResponses
      description: This endpoint is the same as POST /people/{vanId}/canvassResponses but uses external IDs rather than VANIDs.
      operationId: people-personidtype-personid-canvassresponses
      parameters:
      - name: personIdType
        in: path
        description: Required; a known person identifier type available in the current context
        schema:
          type: string
          default: GWID
        required: true
      - name: personId
        in: path
        description: Required; an external identifier, URL encoded
        schema:
          type: string
          default: '3'
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                canvassContext:
                  type: object
                  description: Optional; describes the context in which this Canvass Response was created
                  properties:
                    contactTypeId:
                      type: integer
                      description: Optional; a valid [Contact Type ID](https://docs.everyaction.com/reference/canvassresponsescontacttypes)
                      format: int32
                    inputTypeId:
                      type: integer
                      description: Optional; a valid [Input Type ID](https://docs.everyaction.com/reference/canvassresponsesinputtypes)  (defaults to `11` → API)
                      default: 11
                      format: int32
                    dateCanvassed:
                      type: string
                      description: Optional; the ISO 8601 formatted date that the canvass attempt was made (defaults to today’s date)
                      format: date
                    phoneId:
                      type: integer
                      description: Optional; the identifier of the phone number that was called when canvassing this person. May result in a phone suppression in the event of certain kinds of Result Codes (e.g., Wrong Number.)
                      format: int32
                    skipMatching:
                      type: boolean
                      description: Optional; if set to `true`, skips matching/de-duping of contact history. Defaults to `false`.
                    omitActivistCodeContactHistory:
                      type: boolean
                      description: Optional; if set to `true`, no contact history record will be created if `responses` contains only Activist Codes
                    phone:
                      type: object
                      description: Optional; describes the context of the phone number where a contact was attempted
                      properties:
                        dialingPrefix:
                          type: string
                          description: The country calling code of the number
                          default: '1'
                        phoneNumber:
                          type: string
                          description: Required when inputTypeId is 1 (Phone) or 37 (SMS); the phone number you are attempting - without calling code/dialing prefix
                          default: 555-555-1234
                        smsOptInStatus:
                          type: string
                          description: 'Optional; Must be one of three values: `I` (Opt-In), `O` (Opt-Out), `U` (Unknown). Please note: phone numbers that have been deactivated by the carrier will be marked with an SMS Opt In Status of "Unknown". This information is updated nightly based on information provided by cell phone carriers.'
                          enum:
                          - I
                          - O
                          - U
                    campaignId:
                      type: integer
                      description: Optional; a valid [Campaign ID](https://docs.everyaction.com/reference/campaigns). Required if `contentId` is also specified.
                      format: int32
                    contentId:
                      type: integer
                      description: Optional; a valid Content ID. If specified, the Content's corresponding Campaign must be specified as `campaignId`.
                      format: int32
                    includeReferenceIdInResponse:
                      type: boolean
                      description: Optional; When set to true, the response body will include a GUID corresponding to the newly created canvass response. This GUID can be used later at GET /people/{vanId}/canvassResponses to retrieve the associated canvassResponseId, which is necessary for patching canvass responses at PATCH /people/{vanId}/canvassResponses/{canvassResponseId}. By default, this parameter is false.
                resultCodeId:
                  type: integer
                  description: Optional; specifies the [Result Code](https://docs.everyaction.com/reference/canvass-responses#canvassresponsesresultcodes) of this Response. If no `resultCodeId` is specified, `responses` must be specified. Conversely, if `responses` are specified, `resultCodeId` must be null (a result of *Canvassed* is implied). The `resultCodeId` must be a valid [Result Code](https://docs.everyaction.com/reference/canvass-responses#canvassresponsesresultcodes) in the current context.
                  default: 205
                  format: int32
                responses:
                  type: array
                  description: Optional; an array of Script Responses. If specified, `resultCodeId` must be null. Each Script Response has a property that determines the response's type. This array can contain multiple types.
                  items:
                    properties:
                      type:
                        type: string
                        description: The `type` of this response dictates the validation requirements of other properties. One of `ActivistCode`, `SurveyResponse`, or `VolunteerActivity`
                        enum:
                        - ActivistCode
                        - SurveyResponse
                        - VolunteerActivity
                      action:
                        type: string
                        description: 'Indicates whether to apply or remove this response from a person (valid for `ActivistCode` and `VolunteerActivity` only). NOTE: when removing a multi-assign Activist Code, include dateCanvassed in the canvassContext array to specify the record.'
                        default: Apply
                        enum:
                        - Apply
                        - Remove
                      activistCodeId:
                        type: integer
                        description: Required if `type` is `ActivistCode`; a valid [Activist Code ID](https://docs.everyaction.com/reference/activist-codes)
                        format: int32
                      surveyQuestionId:
                        type: integer
                        description: Required if `type` is `SurveyResponse`; a valid [Survey Question ID](https://docs.everyaction.com/reference/survey-questions)
                        format: int32
                      surveyResponseId:
                        type: integer
