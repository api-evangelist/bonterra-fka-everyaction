              schema:
                type: object
                properties:
                  vanId:
                    type: integer
                    example: 100476252
                    default: 0
                  firstName:
                    type: string
                    example: James
                  lastName:
                    type: string
                    example: Gordon
                  middleName:
                    type: string
                    example: Worthington
                  party:
                    type: string
                    example: D
                  employer:
                    type: string
                    example: Acme Medical Group
                  occupation:
                    type: string
                    example: Physician
                  sex:
                    type: string
                    example: M
                  dateOfBirth:
                    type: string
                    example: '1976-07-04T00:00:00Z'
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": [\n    {\n      \"code\": \"FORBIDDEN\",\n      \"text\": \"Access to this resource is restricted.\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
